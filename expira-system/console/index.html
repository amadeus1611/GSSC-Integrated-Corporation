<style>
:root{
  --bg:#faf8f3;--side:#f3efe4;--sheet:#ffffff;--bubble:#efeadd;--ink:#0B1A3F;--text:#1f2638;--slate:#4f5663;--mute:#858b96;

  --facet-a:#2C3549;--facet-b:#09101E;--wm:#0B1A3F;--code:#f3efe4;
  --ok:#2f6b4f;--bad:#8c3a31;--warn:#9a6a14;--shadow:0 1px 2px rgba(11,26,63,.06),0 8px 28px -12px rgba(11,26,63,.18);

}

  --bg:#0c1322;--side:#09101E;--sheet:#131c2f;--bubble:#1b263c;--ink:#ece6d8;--text:#ddd6c6;--slate:#a9b0bd;--mute:#7f8898;
  --hair:#1f2a40;--hair-2:#2c3a55;--gold:#c9a35c;--gold-ink:#d9b873;--gold-wash:#2a2416;--facet-a:#c9c2b2;--facet-b:#8f98a8;--wm:#ece6d8;--code:#0f1829;

  --hair:#1f2a40;--hair-2:#2c3a55;--gold:#c9a35c;--gold-ink:#d9b873;--gold-wash:#2a2416;--facet-a:#c9c2b2;--facet-b:#8f98a8;--wm:#ece6d8;--code:#0f1829;

html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}button,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.app{display:flex;height:100%}

/* Sidebar */
.side{width:260px;flex:none;background:var(--side);border-right:1px solid var(--hair);display:flex;flex-direction:column;padding:14px 10px;transition:width .6s var(--soft),padding .6s var(--soft)}
.app.collapsed .side{width:58px}
.side-top{display:flex;align-items:center;gap:8px;padding:2px 4px 14px}
.brand{display:flex;align-items:center;gap:9px;overflow:hidden;white-space:nowrap}
.brand .mark{width:44px;flex:none}

UVORK5CYII=) center/contain no-repeat;transition:opacity .4s var(--soft)}
.app.collapsed .wm,.app.collapsed .side .label,.app.collapsed .recents{opacity:0;pointer-events:none}
.icon-btn{width:34px;height:34px;flex:none;display:grid;place-items:center;border:0;background:transparent;border-radius:8px;cursor:pointer;color:var(--slate);transition:background .6s var(--soft),color .6s var(--soft)}
.icon-btn:hover{background:var(--hair);color:var(--ink);transition-duration:.18s}
.icon-btn svg{width:18px;height:18px}
#collapse{margin-left:auto}
.app.collapsed #collapse{margin-left:0}
.app.collapsed .side-top{flex-direction:column}
.app.collapsed .brand .mark{width:34px}
.new{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;padding:8px;border-radius:8px;cursor:pointer;color:var(--ink);font-weight:500;white-space:nowrap;transition:background .6s var(--soft)}
.new:hover{background:var(--hair);transition-duration:.18s}
.new .plus{width:26px;height:26px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;flex:none}
.recents{margin-top:18px;overflow:auto;flex:1;transition:opacity .4s var(--soft)}
.recents h3{font:500 11.5px var(--sans);color:var(--mute);margin:0 8px 6px}
.chat-item{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:8px;color:var(--text);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px;transition:background .6s var(--soft)}
.chat-item:hover{background:var(--hair);transition-duration:.18s}
.chat-item.on{background:var(--hair-2)}
.side-foot{display:flex;align-items:center;gap:10px;padding:10px 6px 2px;border-top:1px solid var(--hair);white-space:nowrap;overflow:hidden}
.av{width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:600 12px var(--sans);flex:none}
.side-foot .label{font-size:13px;line-height:1.3}.side-foot small{display:block;color:var(--mute);font-size:11.5px}
@media (max-width:760px){.side{position:fixed;inset:0 auto 0 0;z-index:40;box-shadow:var(--shadow);transform:translateX(0);transition:transform .6s var(--soft)}.app.collapsed .side{width:260px;transform:translateX(-100%)}.app.collapsed .wm,.app.collapsed .side .label,.app.collapsed .recents{opacity:1}#openSide{display:grid!important}}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.topbar{height:52px;flex:none;display:flex;align-items:center;gap:8px;padding:0 16px}
#openSide{display:none}
.title{font-size:13.5px;color:var(--slate);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .status{margin-left:auto;font-size:12px;color:var(--mute);display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--mute)}.dot.live{background:var(--ok)}.dot.off{background:var(--warn)}
.scroll{flex:1;overflow-y:auto;padding:0 16px}
.thread{max-width:740px;margin:0 auto;padding:12px 0 40px;display:flex;flex-direction:column;gap:28px}

/* Empty state */
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 16px 8vh;text-align:center}
.hero .mark{width:120px;margin-bottom:22px;animation:rise 1.1s var(--soft) both}
.greet{font:400 clamp(26px,3.6vw,38px)/1.25 var(--display);color:var(--ink);margin:0 0 30px;text-wrap:balance;animation:rise 1.1s var(--soft) .08s both}
@keyframes rise{from{transform:translateY(12px);opacity:.001}to{transform:none;opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px;max-width:740px}
.chip{border:1px solid var(--hair-2);background:var(--sheet);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--slate);cursor:pointer;transition:border-color .6s var(--soft),color .6s var(--soft),transform .6s var(--soft);animation:rise 1.1s var(--soft) both}
.chip:hover{border-color:var(--gold);color:var(--ink);transform:translateY(-1px);transition-duration:.18s}
.app.has-chat .hero{display:none}.app:not(.has-chat) .scroll{display:none}

/* Composer */
.dock{flex:none;padding:0 16px calc(12px + env(safe-area-inset-bottom,0px))}
.app:not(.has-chat) .dock{position:static;padding:0;width:100%;max-width:740px}
.composer{max-width:740px;margin:0 auto;background:var(--sheet);border:1px solid var(--hair-2);border-radius:18px;box-shadow:var(--shadow);transition:border-color .6s var(--soft),box-shadow .6s var(--soft)}
.composer:focus-within{border-color:color-mix(in srgb,var(--gold) 60%,var(--hair-2));transition-duration:.18s}
#prompt{display:block;width:100%;border:0;background:transparent;resize:none;outline:none;padding:16px 18px 4px;min-height:56px;max-height:220px;font-size:15px;line-height:1.5}
.comp-row{display:flex;align-items:center;gap:8px;padding:6px 10px 10px 12px}
.pill{display:flex;align-items:center;gap:7px;border:1px solid var(--hair);background:transparent;border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--slate);cursor:pointer;transition:background .6s var(--soft),border-color .6s var(--soft)}
.pill:hover{background:var(--bg);transition-duration:.18s}
.pill[aria-pressed="true"]{border-color:color-mix(in srgb,var(--gold) 50%,var(--hair));color:var(--gold-ink);background:var(--gold-wash)}
.pill svg{width:14px;height:14px}
.send{margin-left:auto;width:34px;height:34px;border-radius:10px;border:0;background:var(--gold);color:#fff;display:grid;place-items:center;cursor:pointer;transition:transform .6s var(--soft),opacity .4s var(--soft),background .6s var(--soft)}
.send:hover{transform:translateY(-1px);transition-duration:.18s}
.send:disabled{opacity:.35;cursor:not-allowed;transform:none}
.send svg{width:16px;height:16px}
.send.stop{background:var(--ink)}
.foot-note{text-align:center;font-size:11.5px;color:var(--mute);margin-top:8px}

/* Messages */
.msg{animation:rise .9s var(--soft) both}
.user{align-self:flex-end;max-width:min(78%,560px);background:var(--bubble);border-radius:16px;padding:10px 16px;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
.bot{display:flex;flex-direction:column;gap:10px}
.answer{font:400 16.5px/1.72 var(--serif);color:var(--text)}
.answer p{margin:0 0 14px}.answer h3{font:600 17px/1.4 var(--serif);margin:20px 0 6px;color:var(--ink)}
.answer ul,.answer ol{margin:0 0 14px;padding-left:22px}.answer li{margin:4px 0}
.answer strong{font-weight:600;color:var(--ink)}
.answer code{font:13px var(--mono);background:var(--code);padding:1px 5px;border-radius:4px}
.answer>:last-child{margin-bottom:0}
.actions{display:flex;gap:2px;align-items:center;opacity:.001;transition:opacity .6s var(--soft)}
.bot:hover .actions,.bot:focus-within .actions,.bot.fresh .actions{opacity:1;transition-duration:.18s}
.actions .icon-btn{width:30px;height:30px}.actions .icon-btn svg{width:15px;height:15px}
.meta{font:500 11.5px var(--mono);color:var(--mute);margin-left:6px;font-variant-numeric:tabular-nums}

/* Working row: Claude's thinking row, orchestrator style */
.work{align-self:flex-start;max-width:100%}
.work-row{display:inline-flex;align-items:center;gap:9px;border:0;background:transparent;padding:4px 8px 4px 0;cursor:pointer;color:var(--slate);font-size:13.5px;border-radius:8px}
.work-row:hover{color:var(--ink)}
.work-row .chev{width:14px;height:14px;transition:transform .6s var(--soft)}
.work.open .chev{transform:rotate(90deg)}
.work-row .t{font:500 12px var(--mono);color:var(--mute);font-variant-numeric:tabular-nums}
.shimmer{background:linear-gradient(90deg,var(--slate) 0%,var(--slate) 40%,var(--gold) 50%,var(--slate) 60%,var(--slate) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 2.4s linear infinite}
@keyframes shim{from{background-position:120% 0}to{background-position:-120% 0}}
.panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .7s var(--soft)}
.work.open .panel{grid-template-rows:1fr}
.panel>div{overflow:hidden}
.steps{margin:8px 0 2px 6px;padding:2px 0 2px 16px;border-left:1px solid var(--hair-2);display:flex;flex-direction:column;gap:10px}
.step{animation:pop .7s var(--soft) both}
@keyframes pop{from{transform:translateY(6px) scale(.985);opacity:.001}to{transform:none;opacity:1}}
.step-h{display:flex;align-items:center;gap:9px;font-size:13px;flex-wrap:wrap}
.step-h .name{font-weight:600;color:var(--ink);text-transform:capitalize}
.step-h .task{color:var(--slate)}
.step-h .peek{margin-left:auto}.step-h .t{font:500 11.5px var(--mono);color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.badge{font:600 10px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;padding:4px 7px;border-radius:4px;background:var(--bg);color:var(--mute);border:1px solid var(--hair)}
.badge.pass{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.badge.fail{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.badge.esc{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.meter{display:inline-flex;gap:2px}.meter i{width:6px;height:10px;background:var(--hair-2);clip-path:polygon(28% 0,100% 0,72% 100%,0 100%)}.meter i.on{background:var(--gold)}
.stream{margin:6px 0 0;padding:10px 12px;border-radius:10px;background:var(--code);font:400 12px/1.6 var(--mono);color:var(--slate);white-space:pre-wrap;word-break:break-word;max-height:150px;overflow:auto;display:none}
.step.show .stream{display:block;animation:pop .6s var(--soft) both}
.peek{border:0;background:transparent;padding:0;color:var(--mute);font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--hair-2)}
.peek:hover{color:var(--ink)}

/* Glyph: the working indicator */
.glyph{width:16px;height:16px;flex:none}
.glyph polygon{fill:var(--gold);opacity:.3}
.busy .glyph .f1{animation:facet 1.6s var(--release) infinite}.busy .glyph .f2{animation:facet 1.6s var(--release) .4s infinite}
.busy .glyph .f3{animation:facet 1.6s var(--release) .8s infinite}.busy .glyph .f4{animation:facet 1.6s var(--release) 1.2s infinite}
.done-g .glyph polygon{opacity:1}
@keyframes facet{0%,100%{opacity:.25}30%{opacity:1}}
.caret{display:inline-block;width:8px;height:16px;background:var(--gold);vertical-align:-3px;margin-left:2px;border-radius:1px;animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}

/* Toasts and tooltip */
.toasts{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:60;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);font-size:13px;padding:9px 16px;border-radius:10px;box-shadow:var(--shadow);animation:toast 3.2s var(--soft) both}
@keyframes toast{0%{transform:translateY(10px) scale(.97);opacity:0}10%{transform:none;opacity:1}85%{opacity:1}100%{transform:translateY(-4px);opacity:0}}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font:500 11.5px var(--sans);padding:5px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;animation:tip .5s var(--soft) both;z-index:70}
@keyframes tip{from{opacity:0;transform:translate(-50%,4px)}to{opacity:1;transform:translate(-50%,0)}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.shimmer{color:var(--slate);background:none}}
</style>

<script>
(() => {
const $=s=>document.querySelector(s), app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function toast(t){const e=document.createElement("div");e.className="toast";e.textContent=t;$("#toasts").append(e);setTimeout(()=>e.remove(),3300)}

/* Policy (orchestrator/POLICY.md). low=quick, medium=default, high=complex */
const TIERS={low:{n:1,m:"quick"},medium:{n:2,m:"default"},high:{n:3,m:"complex"}};
const ROSTER={
 research:{tiers:["medium","high"],floor:"medium",verb:"Researching",brief:"Research specialist. Find facts, figures and precedents. Name each source or mark it unverified. Never present an unverified figure as fact."},
 finance:{tiers:["high"],floor:"high",verb:"Costing",brief:"Finance specialist. Build costs and pricing line by line from the facts given; state every assumption; totals in PHP unless told otherwise."},
 legal:{tiers:["high"],floor:"high",verb:"Reviewing",brief:"Legal review specialist (Philippine context unless told otherwise). Flag each risk with the clause, exposure and a fix. No final legal opinion; say where counsel is needed."},
 decision:{tiers:["medium","high"],floor:"medium",verb:"Weighing options",brief:"Decision specialist. Options memo: recommendation, two or three options, trade-offs, risks, what the principal must decide. Recommend; never approve."},
 builder:{tiers:["medium"],floor:"medium",verb:"Drafting",brief:"Builder. Produce the concrete artefact asked for (outline, plan, draft, code) in clean usable form."}};
const meter=t=>`<span class="meter" aria-label="${t} effort">${[1,2,3].map(i=>`<i class="${i<=TIERS[t].n?"on":""}"></i>`).join("")}</span>`;
const GLYPH=`<svg class="glyph" viewBox="0 0 16 16" aria-hidden="true"><polygon class="f1" points="0,0 7,0 4,6.5"/><polygon class="f2" points="8.5,0 16,0 16,7"/><polygon class="f3" points="16,9 16,16 9,16"/><polygon class="f4" points="0,7 6,16 0,16"/></svg>`;
const CHEV=`<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3.5L10.5 8 6 12.5"/></svg>`;
const tok=s=>Math.round(s.length/4), ft=n=>n>=1000?(n/1000).toFixed(1)+"k":n;
const fmt=ms=>{const s=Math.floor(ms/1000);return s<60?s+"s":Math.floor(s/60)+"m "+String(s%60).padStart(2,"0")+"s"};
function md(src){const L=esc(src).split("\n");let o="",list=null;const inl=s=>s.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>");
 for(const l of L){const h=l.match(/^#{1,4}\s+(.*)/),b=l.match(/^\s*[-*]\s+(.*)/),n=l.match(/^\s*\d+[.)]\s+(.*)/);const want=b?"ul":n?"ol":null;
  if(list&&want!==list){o+=`</${list}>`;list=null} if(want&&!list){o+=`<${want}>`;list=want}
  if(h)o+=`<h3>${inl(h[1])}</h3>`;else if(want)o+=`<li>${inl((b||n)[1])}</li>`;else if(l.trim())o+=`<p>${inl(l)}</p>`}
 return o+(list?`</${list}>`:"")}

/* ---------- chats (per-viewer, this browser) ---------- */
const store={get(){try{return JSON.parse(localStorage.getItem("expira.chats")||"null")}catch(e){return null}},set(v){try{localStorage.setItem("expira.chats",JSON.stringify(v))}catch(e){}}};
const EXAMPLE={id:"example",title:"Belmont drapery refit",example:true,turns:[
 {role:"user",content:"Belmont Hotel wants 40 guest rooms refitted with blackout drapery and ceiling track before December. Scope it, price it roughly, flag contract risks, and recommend how we proceed."},
 {role:"assistant",content:"### Recommendation\nRun it as a **phased programme**: two floors in November, the remaining rooms in December once samples are approved. A single December push leaves no room for a late sample sign-off.\n\n### Indicative budget\n- About **PHP 22,050 per room**, drapery, track and installation\n- **PHP 952,560** for 40 rooms including an 8% contingency, before VAT\n\n### Before we quote\n- Get guaranteed room blocks from Belmont in writing\n- Agree the delay clause wording with counsel\n- Approve the phased schedule and contingency level",
  work:{ms:94000,firewall:"clear",steps:[{role:"research",tier:"medium",task:"Iloilo rates and lead times",v:"pass",ms:14000,out:"Blackout drapery, hotel grade: PHP 9,500–13,800 per window (verified).\nCeiling track: PHP 2,100–2,900 per metre (verified).\nLead time 5–7 weeks (staff canvass, unverified).\nCONFIDENCE: medium"},{role:"finance",tier:"high",task:"Budget for 40 rooms",v:"pass",ms:38000,out:"Per room PHP 22,050. 40 rooms PHP 882,000. Contingency 8% PHP 70,560. Total PHP 952,560 before VAT.\nCONFIDENCE: medium"},{role:"legal",tier:"high",task:"Deadline contract risks",v:"pass",ms:33000,out:"Cap liquidated damages at 10%; exclude delay from late sample approval; variations by signed order only. Counsel: LD wording.\nCONFIDENCE: high"},{role:"decision",tier:"medium",task:"How to proceed",v:"pass",ms:21000,out:"Recommend phased. Options: full push, phased, January start. Duke decides schedule and contingency.\nCONFIDENCE: high"}]}}]};
let chats=store.get()||[]; if(!chats.find(c=>c.id==="example")) chats.push(EXAMPLE);
let cur=null;
function saveChats(){store.set(chats.filter(c=>!c.example).concat(chats.filter(c=>c.example)))}
function renderRecents(){$("#recents").innerHTML=chats.map(c=>`<button class="chat-item ${cur&&cur.id===c.id?"on":""}" data-id="${esc(c.id)}">${esc(c.title)}${c.example?" · example":""}</button>`).join("")}
$("#recents").addEventListener("click",e=>{const b=e.target.closest(".chat-item");if(!b||busy)return;open(chats.find(c=>c.id===b.dataset.id));if(innerWidth<760)app.classList.add("collapsed")});

function workHTML(w,live){
 const steps=(w.steps||[]).map((s,i)=>stepHTML(s,i)).join("");
 const sum=live?`<span class="shimmer" data-k="label">Planning</span>`:`<span data-k="label">${summary(w)}</span>`;
 return `<div class="work ${live?"busy":"done-g"}"><button type="button" class="work-row" aria-expanded="false">${GLYPH}${sum}<span class="t" data-k="t">${live?"0s":fmt(w.ms)}</span>${CHEV}</button><div class="panel"><div><div class="steps" data-k="steps">${steps}</div></div></div></div>`}
const summary=w=>{const n=(w.steps||[]).length;return n?`Worked with ${n} specialist${n>1?"s":""}${w.firewall==="clear"?" · firewall clear":w.firewall==="blocked"?" · held by firewall":""}`:"Answered directly"};
function stepHTML(s,i){return `<div class="step" data-i="${i}"><div class="step-h">${meter(s.tier)}<span class="name">${esc(s.role)}</span><span class="task">${esc(s.task)}</span><span class="badge ${s.v||""}" data-k="v">${s.v?(s.v==="pass"?(s.redo?"Pass ↑":"Pass"):s.v==="fail"?"Fail":"Escalated"):"Working"}</span><button type="button" class="peek">Show work</button><span class="t" data-k="t">${s.ms?fmt(s.ms):"0s"}${s.out?" · ↓ "+ft(tok(s.out)):""}</span></div><pre class="stream" data-k="out">${esc(s.out||"")}</pre></div>`}
document.addEventListener("click",e=>{
 const r=e.target.closest(".work-row");if(r){const w=r.closest(".work");w.classList.toggle("open");r.setAttribute("aria-expanded",w.classList.contains("open"));return}
 const p=e.target.closest(".peek");if(p){const s=p.closest(".step");s.classList.toggle("show");p.textContent=s.classList.contains("show")?"Hide work":"Show work";return}
 const c=e.target.closest("[data-copy]");if(c){const t=c.closest(".bot").querySelector(".answer").innerText;navigator.clipboard?.writeText(t).then(()=>toast("Copied"),()=>toast("Select the text to copy it"));}
});
function botHTML(t,meta){return `<div class="bot msg">${t.work?workHTML(t.work,false):""}<div class="answer">${md(t.content)}</div><div class="actions"><button class="icon-btn" data-copy data-tip="Copy" aria-label="Copy"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="6.5" y="6.5" width="10" height="10" rx="2"/><path d="M13.5 6.5V5a1.5 1.5 0 00-1.5-1.5H5A1.5 1.5 0 003.5 5v7A1.5 1.5 0 005 13.5h1.5"/></svg></button><span class="meta">${esc(meta||"")}</span></div></div>`}
function open(c){cur=c;app.classList.toggle("has-chat",!!c);$("#title").textContent=c?c.title+(c.example?" · example":""):"";
 if(c){$("#thread").innerHTML=c.turns.map(t=>t.role==="user"?`<div class="user msg">${esc(t.content)}</div>`:botHTML(t,t.work?fmt(t.work.ms):"")).join("");$("#dock").append&&document.querySelector(".main").append($("#dock"));requestAnimationFrame(()=>$("#scroll").scrollTop=1e9)}
 else{$("#heroDock").append($("#dock"));$("#thread").innerHTML=""}
 renderRecents()}

/* greeting + suggestions */
const h=new Date().getHours();$("#greet").textContent=(h<12?"Good morning":h<18?"Good afternoon":"Good evening")+", Duke";
const SUG=["Price a 12-room hotel repaint in Iloilo","Review a supply contract's delay clause","Compare three ERP options for GSSC","Draft a scope for an office fit-out"];
$("#chips").innerHTML=SUG.map((s,i)=>`<button class="chip" style="animation-delay:${.15+i*.06}s">${esc(s)}</button>`).join("");
$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;promptEl.value=b.textContent;grow();promptEl.focus()});

/* chrome */
$("#collapse").onclick=()=>app.classList.toggle("collapsed");$("#openSide").onclick=()=>app.classList.remove("collapsed");
if(innerWidth<760)app.classList.add("collapsed");
$("#newChat").onclick=()=>{if(busy)return;open(null);promptEl.focus()};
for(const id of["safe","deep"])$("#"+id).onclick=e=>{const b=e.currentTarget,on=b.getAttribute("aria-pressed")!=="true";b.setAttribute("aria-pressed",on);toast(id==="safe"?(on?"Client-safe on: answers are firewall-scanned":"Client-safe off: internal answers only"):(on?"Specialists on: every request is delegated":"Auto: EXPIRA decides when to delegate"))};
const promptEl=$("#prompt");const grow=()=>{promptEl.style.height="auto";promptEl.style.height=Math.min(promptEl.scrollHeight,220)+"px";$("#send").disabled=busy?false:!promptEl.value.trim()||!sample};
promptEl.addEventListener("input",grow);
promptEl.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();$("#form").requestSubmit()}});
addEventListener("keydown",e=>{if(e.key==="Escape"&&busy)ctl?.abort()});

/* ---------- runtime ---------- */
let sample=null,db=null,ctl=null,busy=false;
(async()=>{sample=await window.claude?.use?.("sample")??null;
 $("#dot").className="dot "+(sample?"live":"off");$("#statusText").textContent=sample?"Opus 5.5 · orchestrator":"Preview";
 if(!sample)$("#footNote").textContent="Open this page in Claude to chat. The example conversation shows a finished run.";grow();
 db=await window.claude?.use?.("db")??null})();
open(chats[0]);

$("#form").addEventListener("submit",e=>{e.preventDefault();if(busy){ctl?.abort();return}const q=promptEl.value.trim();if(q&&sample)send(q)});
function setBusy(on){busy=on;const s=$("#send");s.classList.toggle("stop",on);s.setAttribute("aria-label",on?"Stop":"Send");s.dataset.tip=on?"Stop (Esc)":"Send";
 s.innerHTML=on?`<svg viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1.5" fill="currentColor"/></svg>`:`<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5"/></svg>`;grow()}
const COPY={not_granted:"EXPIRA needs permission to use Claude. Reload to be asked again.",rate_limited:"Too many requests. Wait a minute, then send again.",session_expired:"Session expired. Sign in again.",refused:"That request was declined. Rephrase it.",prompt_too_large:"That's too long. Shorten it.",invalid_json:"Planning failed. Send again."};

async function send(q){
 if(!cur||cur.example){cur={id:"c"+Date.now(),title:q.slice(0,48),turns:[]};chats.unshift(cur)}
 cur.turns.push({role:"user",content:q});promptEl.value="";open(cur);setBusy(true);ctl=new AbortController();
 const safe=$("#safe").getAttribute("aria-pressed")==="true",deep=$("#deep").getAttribute("aria-pressed")==="true";
 const holder=document.createElement("div");holder.className="bot msg";holder.innerHTML=workHTML({steps:[]},true)+`<div class="answer"></div>`;$("#thread").append(holder);
 const W=holder.querySelector(".work"),label=W.querySelector('[data-k="label"]'),tEl=W.querySelector('[data-k="t"]'),stepsEl=W.querySelector('[data-k="steps"]'),ans=holder.querySelector(".answer");
 const t0=performance.now();const tick=setInterval(()=>tEl.textContent=fmt(performance.now()-t0),250);
 const follow=()=>{const s=$("#scroll");if(s.scrollHeight-s.scrollTop-s.clientHeight<160)s.scrollTop=1e9};
 const history=cur.turns.slice(-7,-1).map(t=>`${t.role==="user"?"User":"EXPIRA"}: ${t.content.slice(0,1200)}`).join("\n\n");
 const work={steps:[],firewall:safe?"pending":"off"};
 try{
  /* 1. Orchestrator on the quick tier: answer directly or plan specialists */
  const plan=await sample.json(`You are the EXPIRA orchestrator (EXPIRA AI Systems, sister company of GSSC Integrated Corporation, Iloilo, Philippines).
Decide whether this message needs specialists. ${deep?"The user asked for specialists: plan at least one step.":"Small talk, simple facts or quick edits need none."}
Roles: research (medium|high, floor medium), finance (high), legal (high), decision (medium|high, floor medium), builder (medium). Start at the floor; use high for research/decision only if the amount exceeds PHP 500,000, sources may conflict, or there is legal exposure. At most 4 steps.
Reply with only JSON: {"title": string (3-6 words naming this chat), "steps": [{"role": string, "tier": string, "task": string (short), "after": [1-based step numbers it needs]}]}
${history?`Conversation so far:\n${history}\n\n`:""}New message: ${q}`,{modelTier:"quick",cache:false,signal:ctl.signal});
  if(cur.turns.length===1&&plan.title){cur.title=String(plan.title).slice(0,60);$("#title").textContent=cur.title;renderRecents()}
  let steps=(plan.steps||[]).filter(s=>ROSTER[s.role]).slice(0,4).map(s=>{const R=ROSTER[s.role];let tier=R.tiers.includes(s.tier)?s.tier:R.floor;if(TIERS[tier].n<TIERS[R.floor].n)tier=R.floor;return{role:s.role,tier,task:String(s.task||""),after:(s.after||[]).map(Number).filter(n=>n>0),redo:0}});
  work.steps=steps;const outs=[];
  if(steps.length){
   W.classList.add("open");W.querySelector(".work-row").setAttribute("aria-expanded","true");
   label.textContent=`Delegating to ${steps.length} specialist${steps.length>1?"s":""}`;
   stepsEl.innerHTML=steps.map((s,i)=>stepHTML(s,i)).join("");
   steps.forEach((s,i)=>setTimeout(()=>toast(`${s.role[0].toUpperCase()+s.role.slice(1)} · ${s.tier} effort`),reduce?0:i*260));
   const brief=s=>`${ROSTER[s.role].brief}\n${history?`Conversation so far:\n${history}\n\n`:""}Request: ${q}\nYour task: ${s.task}\n${s.after.filter(n=>outs[n-1]).map(n=>`Input from ${steps[n-1].role}:\n${outs[n-1].slice(0,3000)}`).join("\n\n")}${s.feedback?`\nA reviewer rejected your last attempt: ${s.feedback}. Fix that.`:""}\nPlain text, under 220 words. End with: CONFIDENCE: high|medium|low`;
   const runOne=async i=>{const s=steps[i],el=stepsEl.querySelector(`.step[data-i="${i}"]`),v=el.querySelector('[data-k="v"]'),te=el.querySelector('[data-k="t"]'),out=el.querySelector('[data-k="out"]');
    v.className="badge";v.textContent=s.redo?"Escalated":"Working";el.querySelector(".step-h").insertAdjacentHTML("afterbegin","");const a=performance.now();
    const iv=setInterval(()=>te.textContent=fmt(performance.now()-a)+(out.textContent?" · ↓ "+ft(tok(out.textContent)):""),250);
    out.innerHTML='<span class="caret"></span>';
    try{const r=await sample(brief(s),{modelTier:TIERS[s.tier].m,cache:false,signal:ctl.signal,onText:({text})=>{out.textContent=text;out.insertAdjacentHTML("beforeend",'<span class="caret"></span>');out.scrollTop=1e9}});
     outs[i]=r.text;out.textContent=r.text;s.out=r.text;s.ms=performance.now()-a;return r.text}finally{clearInterval(iv);te.textContent=fmt(performance.now()-a)+" · ↓ "+ft(tok(out.textContent))}};
   const done=[];steps.forEach((s,i)=>done[i]=(async()=>{for(const n of s.after)if(done[n-1])await done[n-1];return runOne(i)})());
   await Promise.all(done);
   /* review with escalation, max 2 redos */
   for(let round=0;round<=2;round++){
    const pend=steps.map((_,i)=>i).filter(i=>steps[i].v!=="pass");if(!pend.length)break;
    label.textContent="Reviewing the work";
    const rv=await sample.json(`You are the EXPIRA reviewer. Check each output answers its task, states sources or assumptions, and has no arithmetic or logic errors.\nReply with only JSON: [{"step": number, "verdict": "pass"|"fail", "reason": string}]\n\n${pend.map(i=>`Step ${i+1} (${steps[i].role}) task: ${steps[i].task}\n${(outs[i]||"").slice(0,2500)}`).join("\n\n---\n\n")}`,{modelTier:"default",cache:false,signal:ctl.signal});
    const fail=[];for(const r of Array.isArray(rv)?rv:[]){const i=Number(r.step)-1;if(!steps[i])continue;steps[i].v=r.verdict==="fail"?"fail":"pass";steps[i].feedback=r.reason;if(steps[i].v==="fail")fail.push(i)}
    pend.forEach(i=>{if(!steps[i].v)steps[i].v="pass"});
    steps.forEach((s,i)=>{const b=stepsEl.querySelector(`.step[data-i="${i}"] [data-k="v"]`);b.className="badge "+s.v;b.textContent=s.v==="pass"?(s.redo?"Pass ↑":"Pass"):"Fail"});
    if(!fail.length||round===2)break;
    label.textContent="Escalating "+fail.length+" step"+(fail.length>1?"s":"");
    await Promise.all(fail.map(async i=>{const s=steps[i],R=ROSTER[s.role];s.tier=R.tiers[Math.min(R.tiers.indexOf(s.tier)+1,R.tiers.length-1)];s.redo++;s.v=null;
     const el=stepsEl.querySelector(`.step[data-i="${i}"]`);el.querySelector(".meter").outerHTML=meter(s.tier);toast(`${s.role} escalated to ${s.tier}`);await runOne(i)}));
   }
  }
  /* answer, streamed */
  label.textContent=steps.length?"Writing the answer":"Thinking";
  const input=`You are EXPIRA, the assistant of EXPIRA AI Systems (sister company of GSSC Integrated Corporation, Iloilo, Philippines). Answer the user's latest message.
Style: warm, precise, executive. Lead with the answer. Use "### " headings and "- " bullets only when they help. Keep it as short as the question allows.
${safe?"CLIENT-SAFE: never include supplier names or contacts, supplier costs or cost basis, margins, markup, bank details, facility locations or internal worksheets.":""}
${history?`Conversation so far:\n${history}\n\n`:""}${steps.length?`Specialists' work:\n${steps.map((s,i)=>`[${s.role}, ${s.tier} effort]\n${(outs[i]||"").slice(0,3000)}`).join("\n\n")}\n\n`:""}Latest message: ${q}`;
  ans.innerHTML='<span class="caret"></span>';
  const fin=await sample(input,{modelTier:steps.length?"default":"quick",cache:false,signal:ctl.signal,onText:({text})=>{if(W.classList.contains("open")&&steps.length){W.classList.remove("open")}ans.innerHTML=md(text)+'<span class="caret"></span>';follow()}});
  ans.innerHTML=md(fin.text);
  if(safe){label.textContent="Firewall check";
   const fw=await sample.json(`EXPIRA firewall. Does this client-facing text contain supplier names or contacts, supplier pricing or cost basis, margin or markup, bank details, facility locations, or internal worksheets?\nReply with only JSON: {"verdict":"clear"|"blocked","hits":[string]}\n\n${fin.text}`,{modelTier:"quick",cache:false,signal:ctl.signal});
   work.firewall=fw.verdict==="blocked"?"blocked":"clear";
   if(work.firewall==="blocked"){ans.insertAdjacentHTML("afterbegin",`<p><strong>Internal only.</strong> Found: ${esc((fw.hits||[]).join("; "))}. Remove before sending to a client.</p>`);toast("Held by firewall: internal only")}}
  work.ms=performance.now()-t0;
  cur.turns.push({role:"assistant",content:fin.text,work:steps.length||safe?{ms:work.ms,firewall:work.firewall,steps:steps.map(s=>({role:s.role,tier:s.tier,task:s.task,v:s.v,redo:s.redo,ms:s.ms,out:(s.out||"").slice(0,4000)}))}:null});
  saveChats();
  try{if(db)await db.collection("runs").doc("r"+Date.now()).set({ts:Date.now(),request:q.slice(0,160),steps:steps.map(s=>({role:s.role,tier:s.tier,verdict:s.v||"",redo:s.redo})),firewall:work.firewall})}catch(e){}
  const idx=$("#thread").children.length-1;holder.outerHTML=botHTML(cur.turns[cur.turns.length-1],fmt(work.ms));$("#thread").lastElementChild.classList.add("fresh");
 }catch(e){
  const code=e&&e.code;W.classList.remove("busy");W.classList.add("done-g");label.classList.remove("shimmer");
  label.textContent=code==="cancelled"?"Stopped":"Interrupted";if(e&&e.text)ans.innerHTML=md(e.text);
  if(code!=="cancelled")toast(COPY[code]||"Something interrupted that. Send again.");
  if(code==="not_granted"||code==="sampling_disabled"){sample=null}
  cur.turns.pop();saveChats();
 }finally{clearInterval(tick);setBusy(false)}
}
})();
</script>
