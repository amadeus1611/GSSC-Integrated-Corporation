<title>EXPIRA Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200..600&family=Libre+Baskerville:ital@0;1&display=swap" rel="stylesheet">
<style>
/* Single deliberate dark look. Type, tracking, rules and rhythm are the GSSC master's tokens. */
:root{color-scheme:dark;
  --void:#05080F;--surface:#0A1020;--raised:#0F172A;--lift:#141d33;
  --ivory:#E8E2D4;--ivory-2:#c9c3b5;--dim:#8B93A7;--faint:#5b6378;
  --line:rgba(232,226,212,.10);--line-2:rgba(232,226,212,.18);--line-3:rgba(232,226,212,.30);
  --gold:#D2AA5E;--gold-deep:#AE8A47;--gold-hi:#F0CF8A;--gold-glow:rgba(210,170,94,.35);--gold-wash:rgba(210,170,94,.08);
  --ok:#8fcfa8;--bad:#ef8f80;--warn:#e7bf6a;
  --f-display:"Libre Baskerville","Hoefler Text",Georgia,"Times New Roman",serif;
  --f-body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --tracked:.18em;--tracked-cap:.14em;--tracked-tight:.12em;--tracked-num:-.012em;
  --rule-hair:.5px;--rule-medium:1px;--u:4px;
  --soft:cubic-bezier(0.16,1,0.3,1);--release:cubic-bezier(0.65,0,0.35,1);
  --in:180ms;--out:600ms;--reveal:1100ms;--frame:41.67ms;
  --grain:none;
}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ivory);font:300 14.5px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden;font-feature-settings:"cv11","ss01"}
*{box-sizing:border-box}button,input,textarea{font:inherit;color:inherit}
::selection{background:var(--gold-glow);color:var(--ivory)}
:focus-visible{outline:var(--rule-medium) solid var(--gold);outline-offset:3px}
.num{font-variant-numeric:tabular-nums;letter-spacing:var(--tracked-num)}
.cap{font-size:10.5px;font-weight:400;letter-spacing:var(--tracked);text-transform:uppercase;color:var(--dim)}
.sr{position:absolute;left:-9999px}

/* faint drafting grid behind everything */
.app{display:flex;height:100%;position:relative;background:
  radial-gradient(1200px 600px at 70% -10%,rgba(210,170,94,.07),transparent 60%),
  linear-gradient(var(--void),var(--void));}
.app::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(232,226,212,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(232,226,212,.035) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at 60% 30%,#000 10%,transparent 70%)}

/* grain: 24 fps film grain for artwork only (website doctrine) */
.grain{position:relative;isolation:isolate}
.grain::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:var(--grain);background-size:160px 160px;mix-blend-mode:overlay;opacity:.55;border-radius:inherit;z-index:2}

/* ---------- sidebar ---------- */
.side{position:relative;z-index:5;width:268px;flex:none;border-right:var(--rule-hair) solid var(--line-2);background:rgba(10,16,32,.72);backdrop-filter:blur(10px);display:flex;flex-direction:column;padding:calc(var(--u)*4) calc(var(--u)*3);transition:transform var(--out) var(--soft),width var(--out) var(--soft)}
.brand{display:flex;align-items:center;gap:12px;padding:0 4px 20px}
.brand .mark{width:56px;filter:drop-shadow(0 0 6px var(--gold-glow))}

YII=) center/contain no-repeat}
.brand .ver{margin-left:auto}
.hbtn{display:flex;align-items:center;gap:10px;width:100%;border:var(--rule-hair) solid var(--line-2);background:transparent;padding:9px 12px;cursor:pointer;color:var(--ivory);font-weight:300;letter-spacing:.01em;transition:border-color var(--out) var(--soft),background var(--out) var(--soft),color var(--out) var(--soft);position:relative}
.hbtn:hover{border-color:var(--gold);background:var(--gold-wash);transition-duration:var(--in)}
.hbtn kbd,.kbd{margin-left:auto;font:400 10px var(--f-body);letter-spacing:var(--tracked-tight);color:var(--faint);border:var(--rule-hair) solid var(--line-2);padding:2px 5px}
.search{margin:12px 0 18px;position:relative}
.search input{width:100%;background:transparent;border:0;border-bottom:var(--rule-hair) solid var(--line-2);padding:8px 2px 8px 22px;outline:none;font-size:13px;transition:border-color var(--out) var(--soft)}
.search input:focus{border-color:var(--gold);transition-duration:var(--in)}
.search svg{position:absolute;left:0;top:11px;width:13px;height:13px;color:var(--faint)}
.recents{flex:1;overflow:auto;margin:0 -4px;padding:0 4px}
.grp{margin:14px 0 6px 8px}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:8px 8px;cursor:pointer;color:var(--ivory-2);font-size:13px;position:relative;transition:color var(--out) var(--soft),background var(--out) var(--soft)}
.item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.item::before{content:"";position:absolute;left:0;top:50%;width:var(--rule-medium);height:0;background:var(--gold);transition:height var(--out) var(--soft),top var(--out) var(--soft);box-shadow:0 0 8px var(--gold-glow)}
.item:hover{color:var(--ivory);background:rgba(232,226,212,.03);transition-duration:var(--in)}
.item.on{color:var(--ivory)}.item.on::before{height:60%;top:20%}
.item .tag{font-size:9.5px;letter-spacing:var(--tracked-tight);text-transform:uppercase;color:var(--faint)}
.foot{border-top:var(--rule-hair) solid var(--line-2);padding-top:14px;display:flex;align-items:center;gap:10px}
.av{width:28px;height:28px;border:var(--rule-hair) solid var(--gold);display:grid;place-items:center;font-size:10.5px;letter-spacing:var(--tracked-tight);color:var(--gold);flex:none}
.foot .who{font-size:12.5px;line-height:1.35}.foot .who small{display:block;color:var(--faint);font-size:10.5px;letter-spacing:.02em}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;z-index:1}
.top{height:54px;flex:none;display:flex;align-items:center;gap:16px;padding:0 24px;border-bottom:var(--rule-hair) solid var(--line)}
.top .ttl{font-size:13px;color:var(--ivory-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top .ref{color:var(--faint);font-size:10.5px;letter-spacing:var(--tracked-tight)}
.top .right{margin-left:auto;display:flex;align-items:center;gap:18px;white-space:nowrap}
.sig{display:inline-flex;align-items:center;gap:8px}
.sig i{width:5px;height:5px;background:var(--faint);transform:rotate(45deg)}
.sig.live i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.sig.off i{background:var(--warn)}
.ibtn{width:32px;height:32px;display:grid;place-items:center;border:var(--rule-hair) solid transparent;background:transparent;cursor:pointer;color:var(--dim);transition:color var(--out) var(--soft),border-color var(--out) var(--soft)}
.ibtn:hover{color:var(--ivory);border-color:var(--line-2);transition-duration:var(--in)}
.ibtn svg{width:16px;height:16px}
#menu{display:none}

.scroll{flex:1;overflow-y:auto;scroll-behavior:smooth;padding:0 24px}
.thread{max-width:780px;margin:0 auto;padding:36px 0 60px;display:flex;flex-direction:column;gap:40px}
.app:not(.has-chat) .scroll,.app:not(.has-chat) .top .ttl{display:none}

/* ---------- empty state ---------- */
.hero{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;padding:0 24px 6vh;text-align:center}
.app:not(.has-chat) .hero{display:flex}
.stage{width:min(420px,70vw);aspect-ratio:1413/560;display:grid;place-items:center;margin-bottom:34px;border-radius:2px;perspective:900px}
.stage .mark{width:78%;transform-style:preserve-3d;transition:transform 1.6s var(--soft);filter:drop-shadow(0 0 18px var(--gold-glow)) drop-shadow(0 0 2px rgba(240,207,138,.4));animation:rise var(--reveal) var(--soft) both}
.stage .ticks{position:absolute;inset:-6px;pointer-events:none}
.greet{font:400 clamp(28px,3.8vw,42px)/1.2 var(--f-display);margin:0 0 8px;color:var(--ivory);animation:rise var(--reveal) var(--soft) .08s both;text-wrap:balance}
.greet em{color:var(--gold);font-style:italic}
.sub{margin:0 0 30px;color:var(--dim);animation:rise var(--reveal) var(--soft) .14s both}
@keyframes rise{from{transform:translateY(14px);opacity:.001;filter:blur(4px)}to{transform:none;opacity:1;filter:none}}
.sugg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;max-width:780px;width:100%;margin-top:26px;border-top:var(--rule-hair) solid var(--line-2)}
.sg{text-align:left;border:0;border-bottom:var(--rule-hair) solid var(--line-2);background:transparent;padding:14px 16px 14px 0;cursor:pointer;display:flex;flex-direction:column;gap:3px;position:relative;animation:rise var(--reveal) var(--soft) both;transition:padding var(--out) var(--soft)}
.sg:nth-child(odd){border-right:var(--rule-hair) solid var(--line-2);padding-right:16px}
.sg:nth-child(even){padding-left:16px}
.sg .cap{color:var(--gold)}
.sg span:last-child{color:var(--ivory-2);font-size:13.5px;transition:color var(--out) var(--soft)}
.sg:hover span:last-child{color:var(--ivory);transition-duration:var(--in)}
.sg::after{content:"→";position:absolute;right:16px;top:50%;transform:translate(-6px,-50%);opacity:0;color:var(--gold);transition:transform var(--out) var(--soft),opacity var(--out) var(--soft)}
.sg:hover::after{opacity:1;transform:translate(0,-50%);transition-duration:var(--in)}
@media (max-width:640px){.sugg{grid-template-columns:1fr}.sg:nth-child(odd){border-right:0}.sg:nth-child(even){padding-left:0}}

/* ---------- composer ---------- */
.dock{flex:none;padding:0 24px calc(18px + env(safe-area-inset-bottom,0px));position:relative}
.app:not(.has-chat) .dock{padding:0;width:100%;max-width:780px}
.comp{max-width:780px;margin:0 auto;position:relative;background:linear-gradient(180deg,var(--raised),var(--surface));border:var(--rule-hair) solid var(--line-2);transition:border-color var(--out) var(--soft),box-shadow var(--out) var(--soft)}
.comp:focus-within{border-color:rgba(210,170,94,.55);box-shadow:0 0 0 var(--rule-hair) rgba(210,170,94,.25),0 20px 60px -30px var(--gold-glow);transition-duration:var(--in)}
.comp::before{content:"";position:absolute;left:0;top:-1px;height:var(--rule-medium);width:28%;background:linear-gradient(90deg,transparent,var(--gold-hi),transparent);opacity:0;pointer-events:none}
.comp:focus-within::before,.app.busy .comp::before{opacity:1;animation:scan 2.8s var(--release) infinite}
@keyframes scan{from{transform:translateX(-40%)}to{transform:translateX(360%)}}
/* crop marks: the print master's registration ticks */
.crop{position:absolute;width:9px;height:9px;border-color:var(--gold);border-style:solid;border-width:0;pointer-events:none;opacity:.7}
.crop.tl{left:-5px;top:-5px;border-left-width:var(--rule-hair);border-top-width:var(--rule-hair)}
.crop.tr{right:-5px;top:-5px;border-right-width:var(--rule-hair);border-top-width:var(--rule-hair)}
.crop.bl{left:-5px;bottom:-5px;border-left-width:var(--rule-hair);border-bottom-width:var(--rule-hair)}
.crop.br{right:-5px;bottom:-5px;border-right-width:var(--rule-hair);border-bottom-width:var(--rule-hair)}
#prompt{display:block;width:100%;border:0;background:transparent;resize:none;outline:none;padding:18px 20px 6px;min-height:60px;max-height:240px;font-size:15.5px;font-weight:300;line-height:1.55}
#prompt::placeholder{color:var(--faint)}
.row{display:flex;align-items:center;gap:6px;padding:8px 10px 10px 14px}
.tg{display:flex;align-items:center;gap:8px;border:var(--rule-hair) solid var(--line-2);background:transparent;padding:6px 10px;cursor:pointer;font-size:10.5px;letter-spacing:var(--tracked-tight);text-transform:uppercase;color:var(--dim);transition:color var(--out) var(--soft),border-color var(--out) var(--soft),background var(--out) var(--soft)}
.tg i{width:6px;height:6px;border:var(--rule-hair) solid var(--dim);transition:background var(--out) var(--soft),border-color var(--out) var(--soft),box-shadow var(--out) var(--soft)}
.tg:hover{color:var(--ivory);border-color:var(--line-3);transition-duration:var(--in)}
.tg[aria-pressed="true"]{color:var(--gold);border-color:rgba(210,170,94,.45);background:var(--gold-wash)}
.tg[aria-pressed="true"] i{background:var(--gold);border-color:var(--gold);box-shadow:0 0 6px var(--gold-glow)}
.count{margin-left:auto;color:var(--faint);font-size:10.5px;letter-spacing:var(--tracked-tight);padding-right:6px}
.send{width:38px;height:38px;border:var(--rule-hair) solid var(--gold);background:var(--gold);color:var(--void);display:grid;place-items:center;cursor:pointer;transition:transform var(--out) var(--soft),background var(--out) var(--soft),opacity var(--out) var(--soft),box-shadow var(--out) var(--soft)}
.send:hover{transform:translateY(-1px);box-shadow:0 8px 24px -8px var(--gold-glow);transition-duration:var(--in)}
.send:disabled{opacity:.28;cursor:not-allowed;transform:none;box-shadow:none}
.send svg{width:15px;height:15px}
.send.stop{background:transparent;color:var(--gold)}
.note{text-align:center;color:var(--faint);font-size:11px;margin-top:10px;letter-spacing:.02em}

/* ---------- messages ---------- */
.m{display:grid;grid-template-columns:92px minmax(0,1fr);gap:0 20px;animation:enter .9s var(--soft) both}
@keyframes enter{from{transform:translateY(10px);opacity:.001;filter:blur(3px)}to{transform:none;opacity:1;filter:none}}
.m-l{padding-top:4px;display:flex;flex-direction:column;gap:4px;border-top:var(--rule-hair) solid var(--line-2)}
.m-l .cap{padding-top:10px}
.m-l .t{font-size:10.5px;color:var(--faint);letter-spacing:var(--tracked-tight)}
.m-b{border-top:var(--rule-hair) solid var(--line-2);padding-top:12px;min-width:0}
.m.you .m-l{border-top-color:var(--line-3)}.m.you .m-l .cap{color:var(--ivory-2)}
.m.you .m-b{font-size:16.5px;line-height:1.6;color:var(--ivory);white-space:pre-wrap;word-wrap:break-word;border-top-color:var(--line-3)}
.m.bot .m-l{border-top-color:var(--gold)}.m.bot .m-l .cap{color:var(--gold)}
.m.bot .m-b{border-top-color:rgba(210,170,94,.4)}
@media (max-width:640px){.m{grid-template-columns:1fr}.m-l{flex-direction:row;gap:10px;border-top:0}.m-l .cap{padding-top:0}.m-b{margin-top:6px}}
.ans{font-size:15.5px;line-height:1.75;color:var(--ivory-2)}
.ans p{margin:0 0 14px}.ans>:last-child{margin-bottom:0}
.ans h3{font:400 17px/1.4 var(--f-display);color:var(--ivory);margin:24px 0 8px}
.ans h3:first-child{margin-top:4px}
.ans strong{font-weight:500;color:var(--ivory)}
.ans ul,.ans ol{margin:0 0 14px;padding-left:18px}.ans li{margin:5px 0;padding-left:4px}
.ans ul li::marker{color:var(--gold);content:"—  "}
.ans ol li::marker{color:var(--gold);font-size:12px}
.ans code{font-size:13px;background:var(--raised);border:var(--rule-hair) solid var(--line-2);padding:1px 5px}
.ans pre{background:var(--surface);border:var(--rule-hair) solid var(--line-2);padding:14px 16px;overflow-x:auto;font-size:13px;line-height:1.6;color:var(--ivory)}
.ans pre code{background:none;border:0;padding:0}
.tw{overflow-x:auto;margin:0 0 16px}
.ans table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
.ans th{text-align:left;font-weight:400;font-size:10.5px;letter-spacing:var(--tracked-tight);text-transform:uppercase;color:var(--dim);border-bottom:var(--rule-hair) solid var(--gold);padding:6px 12px 6px 0}
.ans td{border-bottom:var(--rule-hair) solid var(--line-2);padding:8px 12px 8px 0}
.caret{display:inline-block;width:7px;height:15px;background:var(--gold);box-shadow:0 0 10px var(--gold-glow);vertical-align:-2px;margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.memo-line{display:flex;align-items:center;gap:14px;margin-top:18px;flex-wrap:wrap}
.runchip{display:inline-flex;align-items:center;gap:10px;border:var(--rule-hair) solid var(--line-2);background:transparent;padding:7px 12px;cursor:pointer;font-size:10.5px;letter-spacing:var(--tracked-tight);text-transform:uppercase;color:var(--dim);transition:border-color var(--out) var(--soft),color var(--out) var(--soft)}
.runchip:hover{border-color:var(--gold);color:var(--ivory);transition-duration:var(--in)}
.runchip b{font-weight:400;color:var(--gold)}
.acts{display:flex;gap:2px;margin-left:auto;opacity:.001;transition:opacity var(--out) var(--soft)}
.m.bot:hover .acts,.m.bot:focus-within .acts,.m.bot.fresh .acts{opacity:1;transition-duration:var(--in)}
.live-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.live-row .st{font-size:13px;color:var(--ivory-2)}
.live-row .num{font-size:11px;color:var(--faint)}

/* working glyph: the mark's facets lighting in turn */
.glyph{width:18px;height:14px;flex:none}
.glyph polygon{fill:var(--gold);opacity:.22}
.on-g .glyph .f1{animation:fct 1.4s var(--release) infinite}.on-g .glyph .f2{animation:fct 1.4s var(--release) .23s infinite}.on-g .glyph .f3{animation:fct 1.4s var(--release) .46s infinite}
.on-g .glyph .f4{animation:fct 1.4s var(--release) .7s infinite}.on-g .glyph .f5{animation:fct 1.4s var(--release) .93s infinite}.on-g .glyph .f6{animation:fct 1.4s var(--release) 1.16s infinite}
.done-g .glyph polygon{opacity:.9}
@keyframes fct{0%,100%{opacity:.18}35%{opacity:1;filter:drop-shadow(0 0 3px var(--gold))}}
.shim{background:linear-gradient(90deg,var(--ivory-2) 0 38%,var(--gold-hi) 50%,var(--ivory-2) 62% 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 2.6s linear infinite}
@keyframes shim{from{background-position:130% 0}to{background-position:-130% 0}}

/* ---------- operations log: the pop-up ---------- */
.ops{position:fixed;right:24px;bottom:24px;z-index:50;width:min(460px,calc(100vw - 32px));max-height:min(620px,calc(100vh - 110px));display:flex;flex-direction:column;background:rgba(8,13,26,.9);backdrop-filter:blur(16px) saturate(1.2);border:var(--rule-hair) solid rgba(210,170,94,.45);box-shadow:0 30px 90px -30px rgba(0,0,0,.9),0 0 0 var(--rule-hair) rgba(210,170,94,.12),0 0 60px -30px var(--gold-glow);
  transform-origin:100% 100%;transform:translateY(16px) scale(.965);opacity:0;filter:blur(6px);pointer-events:none;clip-path:inset(0 0 100% 0);
  transition:transform .9s var(--soft),opacity .6s var(--soft),filter .9s var(--soft),clip-path 1.1s var(--soft)}
.ops.open{transform:none;opacity:1;filter:none;pointer-events:auto;clip-path:inset(0 0 0 0)}
.ops .crop{opacity:1}
.ops-h{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;border-bottom:var(--rule-hair) solid var(--line-2)}
.ops-h .cap{color:var(--gold)}
.tc{margin-left:auto;font-size:12px;color:var(--ivory);letter-spacing:.06em}
.rec{width:6px;height:6px;border-radius:50%;background:var(--bad);box-shadow:0 0 8px var(--bad);animation:rec 1.2s steps(1) infinite}
.ops:not(.running) .rec{background:var(--faint);box-shadow:none;animation:none}
@keyframes rec{50%{opacity:.25}}
.band{height:64px;position:relative;border-bottom:var(--rule-hair) solid var(--line-2);background:radial-gradient(400px 80px at 50% 120%,rgba(210,170,94,.14),transparent 70%)}
.band canvas{position:absolute;inset:0;width:100%;height:100%}
.band .lbl{position:absolute;left:14px;top:8px;z-index:3}
.band .rate{position:absolute;right:14px;top:8px;z-index:3;font-size:11px;color:var(--ivory-2)}
.lanes{padding:6px 0}
.lane{display:grid;grid-template-columns:22px 1fr auto;gap:2px 10px;padding:9px 14px;animation:lane .8s var(--soft) both}
@keyframes lane{from{opacity:.001;transform:translateX(12px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
.lane .ix{font-size:10.5px;color:var(--faint);padding-top:1px}
.lane .nm{display:flex;align-items:center;gap:9px;min-width:0;font-size:12.5px}
.lane .nm b{font-weight:400;color:var(--ivory);text-transform:capitalize}
.lane .nm .tk{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lane .stt{font-size:10px;letter-spacing:var(--tracked-tight);text-transform:uppercase;color:var(--dim);text-align:right;white-space:nowrap}
.lane .stt.pass{color:var(--ok)}.lane .stt.fail{color:var(--bad)}.lane .stt.esc{color:var(--warn)}.lane .stt.live{color:var(--gold)}
.track{grid-column:2/4;height:var(--rule-medium);background:var(--line);position:relative;margin-top:5px;overflow:visible}
.track i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,rgba(210,170,94,.2),var(--gold));transition:width 1.1s var(--soft)}
.track i::after{content:"";position:absolute;right:-2px;top:-2px;width:5px;height:5px;background:var(--gold-hi);box-shadow:0 0 10px 2px var(--gold-glow);opacity:0;transition:opacity .6s var(--soft)}
.lane.think .track i{width:22%;animation:travel 2s var(--release) infinite}
.lane.think .track i::after,.lane.stream .track i::after{opacity:1}
@keyframes travel{from{left:-22%}to{left:100%}}
.lane.done .track i{width:100%!important;background:linear-gradient(90deg,rgba(210,170,94,.15),rgba(210,170,94,.55))}
.lane .mt{grid-column:2/4;display:flex;gap:14px;font-size:10.5px;color:var(--faint);letter-spacing:.02em;margin-top:3px}
.meter{display:inline-flex;gap:2px;flex:none}.meter i{width:5px;height:9px;background:var(--line-3);clip-path:polygon(30% 0,100% 0,70% 100%,0 100%)}.meter i.on{background:var(--gold)}
.feed{border-top:var(--rule-hair) solid var(--line-2);padding:8px 14px 10px;overflow:auto;flex:1;min-height:70px;max-height:170px;font-size:11px;line-height:1.7}
.feed div{display:grid;grid-template-columns:78px 72px 1fr;gap:8px;color:var(--ivory-2);animation:lane .6s var(--soft) both}
.feed .ts{color:var(--faint)}.feed .ph{color:var(--gold);letter-spacing:var(--tracked-tight);text-transform:uppercase;font-size:10px;padding-top:1px}
.ops-f{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:var(--rule-hair) solid var(--line-2);font-size:10.5px;color:var(--faint)}
.ops-f .peek{margin-left:auto}
.peek{border:0;background:none;color:var(--dim);cursor:pointer;font-size:10.5px;letter-spacing:var(--tracked-tight);text-transform:uppercase;padding:0;transition:color var(--out) var(--soft)}
.peek:hover{color:var(--gold);transition-duration:var(--in)}
.stream{grid-column:2/4;margin:6px 0 0;padding:8px 10px;background:rgba(5,8,15,.7);border-left:var(--rule-hair) solid var(--gold);font-size:11.5px;line-height:1.6;color:var(--ivory-2);white-space:pre-wrap;word-break:break-word;max-height:120px;overflow:auto;display:none}
.lane.show .stream{display:block;animation:lane .5s var(--soft) both}
.ops-min{position:fixed;right:24px;bottom:24px;z-index:49;display:flex;align-items:center;gap:10px;border:var(--rule-hair) solid rgba(210,170,94,.45);background:rgba(8,13,26,.88);backdrop-filter:blur(12px);padding:9px 14px;cursor:pointer;font-size:10.5px;letter-spacing:var(--tracked-tight);text-transform:uppercase;color:var(--ivory-2);opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .6s var(--soft),transform .9s var(--soft)}
.ops-min.show{opacity:1;transform:none;pointer-events:auto}
@media (max-width:760px){.ops{right:8px;left:8px;bottom:8px;width:auto}.ops-min{right:12px;bottom:auto;top:62px}}

/* ---------- palette, toasts, tips, jump ---------- */
.veil{position:fixed;inset:0;z-index:80;background:rgba(3,5,10,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .6s var(--soft)}
.veil.open{opacity:1;pointer-events:auto}
.pal{position:fixed;left:50%;top:18vh;z-index:81;width:min(560px,calc(100vw - 32px));background:var(--surface);border:var(--rule-hair) solid rgba(210,170,94,.45);box-shadow:0 40px 100px -40px #000;transform:translate(-50%,-10px) scale(.98);opacity:0;filter:blur(6px);pointer-events:none;transition:transform .9s var(--soft),opacity .5s var(--soft),filter .9s var(--soft)}
.pal.open{transform:translate(-50%,0);opacity:1;filter:none;pointer-events:auto}
.pal input{width:100%;border:0;border-bottom:var(--rule-hair) solid var(--line-2);background:transparent;padding:16px 18px;outline:none;font-size:15px;font-weight:300}
.pal ul{list-style:none;margin:0;padding:6px 0;max-height:320px;overflow:auto}
.pal li{display:flex;align-items:center;gap:12px;padding:10px 18px;cursor:pointer;color:var(--ivory-2);font-size:13.5px;position:relative}
.pal li.on{color:var(--ivory);background:var(--gold-wash)}
.pal li.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:var(--rule-medium);background:var(--gold);box-shadow:0 0 8px var(--gold-glow)}
.pal li .kbd{margin-left:auto}
.toasts{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;background:rgba(10,16,32,.92);backdrop-filter:blur(10px);border:var(--rule-hair) solid rgba(210,170,94,.4);color:var(--ivory);font-size:12.5px;padding:9px 14px;animation:toast 3.4s var(--soft) both;box-shadow:0 18px 50px -24px #000}
.toast i{width:5px;height:5px;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 6px var(--gold)}
@keyframes toast{0%{opacity:0;transform:translateY(-10px);filter:blur(4px)}12%{opacity:1;transform:none;filter:none}82%{opacity:1}100%{opacity:0;transform:translateY(-4px)}}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);background:var(--raised);border:var(--rule-hair) solid var(--line-3);color:var(--ivory);font:300 11.5px var(--f-body);letter-spacing:.01em;text-transform:none;padding:5px 9px;white-space:nowrap;pointer-events:none;animation:tip .6s var(--soft) both;z-index:95}
@keyframes tip{from{opacity:0;transform:translate(-50%,4px)}to{opacity:1;transform:translate(-50%,0)}}
.jump{position:absolute;left:50%;top:-52px;transform:translate(-50%,8px);opacity:0;pointer-events:none;border:var(--rule-hair) solid var(--line-3);background:var(--surface);color:var(--ivory-2);font-size:10.5px;letter-spacing:var(--tracked-tight);text-transform:uppercase;padding:7px 12px;cursor:pointer;transition:opacity .6s var(--soft),transform .9s var(--soft)}
.jump.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}

@media (max-width:760px){.side{position:fixed;inset:0 auto 0 0;z-index:60;transform:translateX(-102%)}.app.side-open .side{transform:none}#menu{display:grid}.top{padding:0 12px}.scroll,.dock{padding-inline:16px}.top .ref,.hide-sm{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.shim{color:var(--ivory-2);background:none}.lane.think .track i{width:22%}}
</style>

<script>
(() => {
const $=s=>document.querySelector(s), app=$("#app"), root=document.documentElement;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const pad=(n,w=2)=>String(n).padStart(w,"0");

/* ---------- film grain: 6 tiles, stepped at 24 fps ---------- */
const tiles=[];(()=>{const c=document.createElement("canvas");c.width=c.height=160;const x=c.getContext("2d");
 for(let k=0;k<6;k++){const d=x.createImageData(160,160);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=Math.random()<.5?38:18}x.putImageData(d,0,0);tiles.push(`url(${c.toDataURL()})`)}
 root.style.setProperty("--grain",tiles[0]);
 if(!reduce){let f=0,last=0;const step=t=>{if(t-last>=41.67&&!document.hidden){last=t;f=(f+1)%tiles.length;root.style.setProperty("--grain",tiles[f])}requestAnimationFrame(step)};requestAnimationFrame(step)}})();

/* ---------- text decode: characters resolve from signal noise ---------- */
const NOISE="ABCDEFHJKLMNPRSTUVWXYZ0123456789/\\·—+×";
function decode(el,to,dur=560){to=String(to);if(reduce||!el){if(el)el.textContent=to;return}
 const id=(el._d=(el._d||0)+1),t0=performance.now(),seed=[...to].map(()=>Math.random()*.35);
 const f=t=>{if(el._d!==id)return;const p=Math.min(1,(t-t0)/dur);let o="";for(let i=0;i<to.length;i++){const c=to[i];o+=(c===" "||p>=(i/to.length)*.65+seed[i])?c:NOISE[(Math.random()*NOISE.length)|0]}el.textContent=o;if(p<1)requestAnimationFrame(f);else el.textContent=to};requestAnimationFrame(f)}

function toast(t){const e=document.createElement("div");e.className="toast";e.innerHTML="<i></i>";e.append(t);$("#toasts").append(e);setTimeout(()=>e.remove(),3500)}

/* ---------- policy: orchestrator/POLICY.md (low=quick, medium=default, high=complex) ---------- */

/* markdown: headings, lists, tables, code fences, bold, inline code */
function md(src){const L=src.split("\n");let o="",list=null,i=0;const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>");
 const close=()=>{if(list){o+=`</${list}>`;list=null}};
 while(i<L.length){const l=L[i];
  if(/^```/.test(l)){close();let b=[];i++;while(i<L.length&&!/^```/.test(L[i]))b.push(L[i++]);i++;o+=`<pre><code>${esc(b.join("\n"))}</code></pre>`;continue}
  if(/^\s*\|.*\|\s*$/.test(l)&&L[i+1]&&/^\s*\|?[\s:-]+\|/.test(L[i+1])){close();const cells=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());const h=cells(l);i+=2;let rows="";while(i<L.length&&/^\s*\|.*\|\s*$/.test(L[i]))rows+=`<tr>${cells(L[i++]).map(c=>`<td>${inl(c)}</td>`).join("")}</tr>`;o+=`<div class="tw"><table><thead><tr>${h.map(c=>`<th>${inl(c)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;continue}
  const h=l.match(/^#{1,4}\s+(.*)/),b=l.match(/^\s*[-*]\s+(.*)/),n=l.match(/^\s*\d+[.)]\s+(.*)/),want=b?"ul":n?"ol":null;
  if(list&&want!==list)close();if(want&&!list){o+=`<${want}>`;list=want}
  if(h)o+=`<h3>${inl(h[1])}</h3>`;else if(want)o+=`<li>${inl((b||n)[1])}</li>`;else if(l.trim())o+=`<p>${inl(l)}</p>`;i++}
 close();return o}

  const plan=await sample.json(`You are the EXPIRA orchestrator (EXPIRA AI Systems, sister company of GSSC Integrated Corporation, Iloilo, Philippines).
Decide whether this message needs specialists. ${deep?"The user asked for specialists: plan at least one step.":"Small talk, simple facts or quick edits need none."}
Roles: research (medium|high, floor medium), finance (high), legal (high), decision (medium|high, floor medium), builder (medium). Start at the floor; use high for research/decision only if the amount exceeds PHP 500,000, sources may conflict, or there is legal exposure. At most 4 steps.
Reply with only JSON: {"title": string (3-6 words naming this chat), "steps": [{"role": string, "tier": string, "task": string (under 8 words), "after": [1-based step numbers it needs]}]}
${history?`Conversation so far:\n${history}\n\n`:""}New message: ${q}`,{modelTier:"quick",cache:false,signal:ctl.signal});
  if(cur.turns.length===1&&plan.title){cur.title=String(plan.title).slice(0,60);decode($("#ttl"),cur.title);renderRecents()}
  const steps=(plan.steps||[]).filter(s=>ROSTER[s.role]).slice(0,4).map(s=>{const R=ROSTER[s.role];let tier=R.tiers.includes(s.tier)?s.tier:R.floor;if(TIERS[tier].n<TIERS[R.floor].n)tier=R.floor;return{role:s.role,tier,task:String(s.task||""),after:(s.after||[]).map(Number).filter(n=>n>0),redo:0}});
  work.steps=steps;const outs=[];
  F("plan",steps.length?`${steps.length} specialist${steps.length>1?"s":""} selected`:"answering directly");
  if(steps.length){
   say(`Delegating to ${steps.length} specialist${steps.length>1?"s":""}`);
   $("#lanes").innerHTML=steps.map(laneHTML).join("");F("delegate",steps.map(s=>`${s.role} · ${s.tier}`).join(", "));
   steps.forEach((s,i)=>setTimeout(()=>toast(`${s.role[0].toUpperCase()+s.role.slice(1)} · ${s.tier} effort`),reduce?0:i*300));
   const brief=s=>`${ROSTER[s.role].brief}\n${history?`Conversation so far:\n${history}\n\n`:""}Request: ${q}\nYour task: ${s.task}\n${s.after.filter(n=>outs[n-1]).map(n=>`Input from ${steps[n-1].role}:\n${outs[n-1].slice(0,3000)}`).join("\n\n")}${s.feedback?`\nA reviewer rejected your last attempt: ${s.feedback}. Fix that.`:""}\nPlain text, under 220 words. End with: CONFIDENCE: high|medium|low`;
   const runOne=async i=>{const s=steps[i],ln=$("#ln"+i),stE=$("#lst"+i),tE=$("#lt"+i),kE=$("#lk"+i),out=$("#lo"+i),tr=$("#ltr"+i);
    ln.className="lane think";stE.className="stt live";decode(stE,s.redo?"Escalated":ROSTER[s.role].verb);const a=performance.now();let last=0;
    const iv=setInterval(()=>{tE.textContent=fmt(performance.now()-a)},250);
    try{const r=await sample(brief(s),{modelTier:TIERS[s.tier].m,cache:false,signal:ctl.signal,onText:({text})=>{if(!last){ln.className="lane stream";F(s.role,"first tokens")}const n=tok(text);bucket+=n-last;last=n;out.textContent=text;out.scrollTop=1e9;kE.textContent="↓ "+ft(n)+" tok";tr.style.width=Math.min(94,6+n/3)+"%"}});
     outs[i]=r.text;s.out=r.text;s.ms=performance.now()-a;return r.text}
    finally{clearInterval(iv);tE.textContent=fmt(performance.now()-a);ln.className="lane done";decode(stE,"Delivered");stE.className="stt"}};
   const done=[];steps.forEach((s,i)=>done[i]=(async()=>{for(const n of s.after)if(done[n-1])await done[n-1];const r=await runOne(i);F(s.role,`delivered · ${ft(tok(r))} tok`);return r})());
   await Promise.all(done);
   for(let round=0;round<=2;round++){
    const pend=steps.map((_,i)=>i).filter(i=>steps[i].v!=="pass");if(!pend.length)break;
    say("Reviewing the work");pend.forEach(i=>{decode($("#lst"+i),"Reviewing");$("#lst"+i).className="stt esc"});
    const rv=await sample.json(`You are the EXPIRA reviewer. Check each output answers its task, states sources or assumptions, and has no arithmetic or logic errors.\nReply with only JSON: [{"step": number, "verdict": "pass"|"fail", "reason": string}]\n\n${pend.map(i=>`Step ${i+1} (${steps[i].role}) task: ${steps[i].task}\n${(outs[i]||"").slice(0,2500)}`).join("\n\n---\n\n")}`,{modelTier:"default",cache:false,signal:ctl.signal});
    const fail=[];for(const r of Array.isArray(rv)?rv:[]){const i=Number(r.step)-1;if(!steps[i])continue;steps[i].v=r.verdict==="fail"?"fail":"pass";steps[i].feedback=r.reason;if(steps[i].v==="fail")fail.push(i)}
    pend.forEach(i=>{if(!steps[i].v)steps[i].v="pass"});
    steps.forEach((s,i)=>{const e=$("#lst"+i);e.className="stt "+s.v;decode(e,s.v==="pass"?(s.redo?"Pass ↑":"Pass"):"Fail")});
    F("review",`${steps.filter(s=>s.v==="pass").length} of ${steps.length} pass`);
    if(!fail.length||round===2)break;
    say(`Escalating ${fail.length} step${fail.length>1?"s":""}`);
    await Promise.all(fail.map(async i=>{const s=steps[i],R=ROSTER[s.role];s.tier=R.tiers[Math.min(R.tiers.indexOf(s.tier)+1,R.tiers.length-1)];s.redo++;s.v=null;
     $("#ln"+i).querySelector(".meter").outerHTML=meter(s.tier);toast(`${s.role} escalated to ${s.tier}`);F("escalate",`${s.role} → ${s.tier}`);await runOne(i)}));
   }
  }
  say(steps.length?"Composing the answer":"Thinking");F("answer","composing");
  const input=`You are EXPIRA, the assistant of EXPIRA AI Systems (sister company of GSSC Integrated Corporation, Iloilo, Philippines). Answer the user's latest message.
Style: precise, executive, calm. Lead with the answer. Use "### " headings, "- " bullets and markdown tables only when they help. Keep it as short as the question allows.
${safe?"CLIENT-SAFE: never include supplier names or contacts, supplier costs or cost basis, margins, markup, bank details, facility locations or internal worksheets.":""}
${history?`Conversation so far:\n${history}\n\n`:""}${steps.length?`Specialists' work:\n${steps.map((s,i)=>`[${s.role}, ${s.tier} effort]\n${(outs[i]||"").slice(0,3000)}`).join("\n\n")}\n\n`:""}Latest message: ${q}`;
  let lastA=0;
  const fin=await sample(input,{modelTier:steps.length?"default":"quick",cache:false,signal:ctl.signal,onText:({text})=>{const n=tok(text);bucket+=n-lastA;lastA=n;ans.innerHTML=md(text)+'<span class="caret"></span>';follow()}});
  ans.innerHTML=md(fin.text);
  if(safe){say("Firewall check");
   const fw=await sample.json(`EXPIRA firewall. Does this client-facing text contain supplier names or contacts, supplier pricing or cost basis, margin or markup, bank details, facility locations, or internal worksheets?\nReply with only JSON: {"verdict":"clear"|"blocked","hits":[string]}\n\n${fin.text}`,{modelTier:"quick",cache:false,signal:ctl.signal});
   work.firewall=fw.verdict==="blocked"?"blocked":"clear";F("firewall",work.firewall==="clear"?"clear":"held · "+(fw.hits||[]).join("; "));
   if(work.firewall==="blocked")toast("Held by firewall. Internal only.")}
  work.ms=performance.now()-runT0;F("answer","delivered");
  const content=(work.firewall==="blocked"?`**Internal only.** The firewall found restricted details. Remove them before sending to a client.\n\n`:"")+fin.text;
  cur.turns.push({role:"assistant",content,ts:Date.now(),work:{ms:work.ms,firewall:work.firewall,feed:work.feed,steps:steps.map(s=>({role:s.role,tier:s.tier,task:s.task,v:s.v,redo:s.redo,ms:s.ms,out:(s.out||"").slice(0,4000)}))}});
  save();
  try{if(db)await db.collection("runs").doc("r"+Date.now()).set({ts:Date.now(),request:q.slice(0,160),steps:steps.map(s=>({role:s.role,tier:s.tier,verdict:s.v||"",redo:s.redo})),firewall:work.firewall})}catch(e){}
  art.outerHTML=botHTML(cur.turns[cur.turns.length-1],cur.turns.length-1);$("#thread").lastElementChild.classList.add("fresh");
  setTimeout(()=>{if(!busy)showOps(false)},1600);
 }catch(e){
  const code=e&&e.code;art.querySelector(".live-row").classList.remove("on-g");st.classList.remove("shim");decode(st,code==="cancelled"?"Stopped":"Interrupted");
  if(e&&e.text)ans.innerHTML=md(e.text);F(code==="cancelled"?"stop":"error",code==="cancelled"?"stopped by you":(code||"interrupted"));
  if(code!=="cancelled")toast(COPY[code]||"Something interrupted that. Send again.");
  if(code==="not_granted"||code==="sampling_disabled")sample=null;
  cur.turns.pop();save();
 }finally{clearInterval(tcTimer);clearTimeout(waveRAF);setBusy(false);drawWave()}
}
})();
</script>
