<title>EXPIRA Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200..600&family=Libre+Baskerville:ital@0;1&display=swap" rel="stylesheet">
<style>
/* Type, tracking, rules and rhythm: the GSSC master template's tokens. Palette: EXPIRA. */
:root{
  --bg:#FAF8F3;--side:#F3EFE4;--panel:#FFFFFF;--well:#F4F1E8;--sheet:#FFFEFB;
  --ink:#0B1A3F;--text:#2B303B;--soft:#5E6573;--mute:#8C919B;
  --line:rgba(11,26,63,.09);--line-2:rgba(11,26,63,.16);--line-3:rgba(11,26,63,.26);
  --gold:#A8862F;--gold-2:#C8A45A;--gold-wash:rgba(168,134,47,.08);--head:#C8A45A;--head-glow:rgba(200,164,90,.55);
  --ok:#2F6B4F;--bad:#8C3A31;--warn:#8A6214;
  --shadow:0 1px 1px rgba(11,26,63,.04),0 10px 30px -18px rgba(11,26,63,.28);
  --mark-a:#2C3549;--mark-b:#09101E;
  --f-display:"Libre Baskerville","Hoefler Text",Georgia,"Times New Roman",serif;
  --f-body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --tracked:.18em;--tracked-cap:.14em;--tracked-tight:.12em;--tracked-num:-.012em;
  --rule-hair:.5px;--rule-medium:1px;--u:4px;
  --soft-close:cubic-bezier(0.16,1,0.3,1);--release:cubic-bezier(0.65,0,0.35,1);
  --in:180ms;--out:600ms;--reveal:1100ms;--grain:none;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0E1320;--side:#0A0F1A;--panel:#151C2C;--well:#121928;--sheet:#111827;
  --ink:#EDE7D9;--text:#D9D3C5;--soft:#A3A8B3;--mute:#737A88;
  --line:rgba(237,231,217,.07);--line-2:rgba(237,231,217,.13);--line-3:rgba(237,231,217,.22);
  --gold:#C8A45A;--gold-2:#D9B873;--gold-wash:rgba(200,164,90,.09);--head:#E3C27E;--head-glow:rgba(227,194,126,.55);
  --ok:#8FC3A6;--bad:#E59A8F;--warn:#E0B765;--shadow:0 1px 1px rgba(0,0,0,.3),0 14px 40px -18px rgba(0,0,0,.7);--mark-a:#C9C2B2;--mark-b:#8F98A8}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0E1320;--side:#0A0F1A;--panel:#151C2C;--well:#121928;--sheet:#111827;
  --ink:#EDE7D9;--text:#D9D3C5;--soft:#A3A8B3;--mute:#737A88;
  --line:rgba(237,231,217,.07);--line-2:rgba(237,231,217,.13);--line-3:rgba(237,231,217,.22);
  --gold:#C8A45A;--gold-2:#D9B873;--gold-wash:rgba(200,164,90,.09);--head:#E3C27E;--head-glow:rgba(227,194,126,.55);
  --ok:#8FC3A6;--bad:#E59A8F;--warn:#E0B765;--shadow:0 1px 1px rgba(0,0,0,.3),0 14px 40px -18px rgba(0,0,0,.7);--mark-a:#C9C2B2;--mark-b:#8F98A8}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:300 14.5px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}button,input,textarea{font:inherit;color:inherit}
::selection{background:var(--gold-wash);color:var(--ink)}
:focus-visible{outline:var(--rule-medium) solid var(--gold);outline-offset:2px;border-radius:3px}
.sr{position:absolute;left:-9999px}
.num{font-variant-numeric:tabular-nums;letter-spacing:var(--tracked-num)}
.cap{font-size:10px;font-weight:400;letter-spacing:var(--tracked);text-transform:uppercase;color:var(--mute)}
.capt{font-size:10px;font-weight:400;letter-spacing:var(--tracked-tight);text-transform:uppercase;color:var(--mute)}
.serif{font-family:var(--f-display);font-weight:400}
/* the shared entrance: fade with a soft blur, soft close */
@keyframes blurIn{from{opacity:.001;filter:blur(5px);transform:translateY(6px)}to{opacity:1;filter:none;transform:none}}
.bi{animation:blurIn .9s var(--soft-close) both}
.w{animation:word .55s var(--soft-close) both}
@keyframes word{from{opacity:.001;filter:blur(4px)}to{opacity:1;filter:none}}
.grain{position:relative;isolation:isolate}
.grain::after{content:"";position:absolute;inset:-4%;pointer-events:none;background-image:var(--grain);background-size:150px;mix-blend-mode:soft-light;opacity:.6;-webkit-mask:var(--gmask) center/contain no-repeat;mask:var(--gmask) center/contain no-repeat}

.app{display:flex;height:100%}

/* ---------- sidebar ---------- */
.side{width:256px;flex:none;background:var(--side);border-right:var(--rule-hair) solid var(--line-2);display:flex;flex-direction:column;padding:16px 10px 12px;transition:margin var(--out) var(--soft-close),transform var(--out) var(--soft-close)}
.app.folded .side{margin-left:-256px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.brand .mark{width:40px}

I=) center/contain no-repeat}
.fold{margin-left:auto}
.nav{display:flex;flex-direction:column;gap:1px;margin-bottom:14px}
.navb{display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:8px 8px;border-radius:5px;cursor:pointer;color:var(--text);text-align:left;font-size:13.5px;transition:background var(--out) var(--soft-close)}
.navb:hover{background:var(--line);transition-duration:var(--in)}
.navb svg{width:15px;height:15px;color:var(--soft);flex:none}
.navb .kb{margin-left:auto}
.kb{font:400 10px var(--f-body);letter-spacing:.06em;color:var(--mute);border:var(--rule-hair) solid var(--line-2);border-radius:3px;padding:1px 5px}
.search{display:none;padding:0 8px 10px}.side.searching .search{display:block}
.search input{width:100%;border:0;border-bottom:var(--rule-hair) solid var(--line-3);background:transparent;padding:6px 0;outline:none;font-size:13px}
.recents{flex:1;overflow:auto}
.grp{padding:14px 8px 6px}
.item{display:block;width:100%;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:5px;cursor:pointer;color:var(--soft);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background var(--out) var(--soft-close),color var(--out) var(--soft-close)}
.item:hover{background:var(--line);color:var(--text);transition-duration:var(--in)}
.item.on{background:var(--line-2);color:var(--ink)}
.item i{font-style:italic;font-family:var(--f-display);font-size:11px;color:var(--mute)}
.foot{display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:var(--rule-hair) solid var(--line-2)}
.av{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:500 10.5px var(--f-body);letter-spacing:.04em;flex:none}
.who{font-size:12.5px;line-height:1.3;color:var(--text)}.who small{display:block;color:var(--mute);font-size:11px}
.ib{width:30px;height:30px;display:grid;place-items:center;border:0;background:transparent;border-radius:5px;cursor:pointer;color:var(--soft);transition:background var(--out) var(--soft-close),color var(--out) var(--soft-close)}
.ib:hover{background:var(--line);color:var(--ink);transition-duration:var(--in)}
.ib svg{width:15px;height:15px}

/* ---------- main ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;transition:margin-right .9s var(--soft-close)}
@media (min-width:1100px){.app.dsp-open .main{margin-right:min(440px,100vw)}}
.progress{position:absolute;left:0;top:0;height:var(--rule-medium);width:0;background:var(--gold);z-index:3;transition:width .3s linear;opacity:.7}
.top{height:50px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px}
#unfold{display:none}.app.folded #unfold{display:grid}
.ttl{font:400 13.5px var(--f-display);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl-ref{color:var(--mute)}
.top .r{margin-left:auto;display:flex;align-items:center;gap:6px}
.dsp-btn{display:flex;align-items:center;gap:8px;border:var(--rule-hair) solid var(--line-2);background:transparent;border-radius:5px;padding:5px 10px;cursor:pointer;font-size:12px;color:var(--soft);transition:border-color var(--out) var(--soft-close),color var(--out) var(--soft-close)}
.dsp-btn:hover{border-color:var(--line-3);color:var(--ink);transition-duration:var(--in)}
.dsp-btn i{width:5px;height:5px;border-radius:50%;background:var(--mute)}
.app.busy .dsp-btn i{background:var(--gold);animation:breathe 2.4s var(--release) infinite}
@keyframes breathe{50%{opacity:.25}}
.sig{display:flex;align-items:center;gap:7px;padding:0 6px}
.sig i{width:5px;height:5px;border-radius:50%;background:var(--warn)}.sig.live i{background:var(--ok)}

.scroll{flex:1;overflow-y:auto;padding:0 20px}
.thread{max-width:720px;margin:0 auto;padding:22px 0 40px;display:flex;flex-direction:column;gap:30px}
.app:not(.has-chat) .scroll,.app:not(.has-chat) .ttl,.app:not(.has-chat) .dsp-btn{display:none}

/* ---------- start ---------- */
.hero{flex:1;display:none;flex-direction:column;align-items:center;justify-content:center;padding:0 20px 5vh;overflow:auto}
.app:not(.has-chat) .hero{display:flex}
.dateline{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.dateline::before,.dateline::after{content:"";width:40px;height:var(--rule-hair);background:var(--line-3)}
.hero .mark-w{width:132px;margin-bottom:20px}
.hero .mark{width:100%;display:block;transition:transform 1.6s var(--soft-close)}
.greet{font:400 clamp(26px,3.4vw,36px)/1.25 var(--f-display);color:var(--ink);margin:0 0 30px;text-align:center;text-wrap:balance}
.greet em{font-style:italic;color:var(--gold)}
.contents{width:100%;max-width:720px;margin-top:30px}
.contents h2{margin:0 0 6px}
.toc{list-style:none;margin:0;padding:0}
.toc button{display:flex;align-items:baseline;gap:10px;width:100%;border:0;background:transparent;padding:9px 0;cursor:pointer;text-align:left;color:var(--text);font-size:14px}
.toc .n{font:400 12px var(--f-display);color:var(--gold);width:18px}
.toc .lead{flex:1;border-bottom:var(--rule-hair) dotted var(--line-3);transform:translateY(-4px);transition:border-color var(--out) var(--soft-close)}
.toc .sec{font:italic 400 12.5px var(--f-display);color:var(--soft)}
.toc .t{transition:color var(--out) var(--soft-close),transform var(--out) var(--soft-close)}
.toc button:hover .t{color:var(--ink);transform:translateX(3px);transition-duration:var(--in)}
.toc button:hover .lead{border-color:var(--gold)}

/* ---------- composer ---------- */
.dock{flex:none;padding:6px 20px calc(10px + env(safe-area-inset-bottom,0px))}
.app:not(.has-chat) .dock{padding:0;width:100%;max-width:720px}
.comp{max-width:720px;margin:0 auto;background:var(--panel);border:var(--rule-hair) solid var(--line-3);border-radius:6px;box-shadow:var(--shadow);transition:border-color var(--out) var(--soft-close),box-shadow var(--out) var(--soft-close)}
.comp:focus-within{border-color:color-mix(in srgb,var(--ink) 40%,transparent);transition-duration:var(--in)}
#prompt{display:block;width:100%;border:0;background:transparent;resize:none;outline:none;padding:14px 16px 4px;min-height:52px;max-height:240px;font-size:15px;line-height:1.55;font-weight:300}
#prompt::placeholder{color:var(--mute)}
.row{display:flex;align-items:center;gap:4px;padding:4px 8px 8px 10px}
.tg{display:flex;align-items:center;gap:7px;border:0;background:transparent;padding:6px 8px;border-radius:4px;cursor:pointer;font-size:12px;color:var(--soft);transition:background var(--out) var(--soft-close),color var(--out) var(--soft-close)}
.tg:hover{background:var(--line);color:var(--ink);transition-duration:var(--in)}
.tg i{width:6px;height:6px;border-radius:50%;border:var(--rule-medium) solid var(--mute);transition:background var(--out) var(--soft-close),border-color var(--out) var(--soft-close)}
.tg[aria-pressed="true"]{color:var(--ink)}.tg[aria-pressed="true"] i{background:var(--gold);border-color:var(--gold)}
.count{margin-left:auto;font-size:11px;color:var(--mute);padding-right:8px;opacity:0;transition:opacity var(--out) var(--soft-close)}
.count.on{opacity:1}
.send{width:32px;height:32px;border-radius:4px;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;cursor:pointer;transition:opacity var(--out) var(--soft-close),transform var(--out) var(--soft-close)}
.send:hover{transform:translateY(-1px);transition-duration:var(--in)}
.send:disabled{opacity:.22;cursor:not-allowed;transform:none}
.send svg{width:14px;height:14px}
.note{text-align:center;color:var(--mute);font-size:11px;margin-top:7px}

/* ---------- messages ---------- */
.you{align-self:flex-end;max-width:min(82%,560px);background:var(--well);border:var(--rule-hair) solid var(--line);border-radius:6px;padding:10px 14px;font-size:15px;line-height:1.6;color:var(--ink);white-space:pre-wrap;word-wrap:break-word}
.bot{display:flex;flex-direction:column;gap:10px}
.by{display:flex;align-items:center;gap:10px}
.by .mark{width:26px}
.by time{font-size:10px;letter-spacing:var(--tracked-tight);color:var(--mute)}
.ans{font-size:15.5px;line-height:1.75;color:var(--text)}
.ans p{margin:0 0 14px}.ans>:last-child{margin-bottom:0}
.ans h3{font:400 17px/1.4 var(--f-display);color:var(--ink);margin:24px 0 6px}
.ans>h3:first-child{margin-top:2px}
.ans strong{font-weight:500;color:var(--ink)}
.ans ul,.ans ol{margin:0 0 14px;padding-left:20px}.ans li{margin:5px 0;padding-left:2px}
.ans ul li::marker{color:var(--gold)}.ans ol li::marker{color:var(--gold);font-family:var(--f-display);font-size:12.5px}
.ans code{font-size:13px;background:var(--well);border:var(--rule-hair) solid var(--line-2);border-radius:3px;padding:1px 5px}
.ans pre{background:var(--well);border:var(--rule-hair) solid var(--line-2);border-radius:5px;padding:12px 14px;overflow-x:auto;font-size:13px}
.ans pre code{border:0;background:none;padding:0}
.tw{overflow-x:auto;margin:0 0 16px}
.ans table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
.ans th{text-align:left;font-weight:400;font-size:10px;letter-spacing:var(--tracked-tight);text-transform:uppercase;color:var(--mute);border-bottom:var(--rule-hair) solid var(--gold);padding:6px 14px 6px 0}
.ans td{border-bottom:var(--rule-hair) solid var(--line-2);padding:8px 14px 8px 0}
.caret{display:inline-block;width:1.5px;height:1.05em;background:var(--gold);vertical-align:-.15em;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.filed{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-top:8px;border-top:var(--rule-hair) solid var(--line)}
.filed .rd{border:0;background:none;padding:0;cursor:pointer;color:var(--gold);font:italic 400 12.5px var(--f-display);transition:color var(--out) var(--soft-close)}
.filed .rd:hover{color:var(--ink);transition-duration:var(--in)}
.dotsep{width:2px;height:2px;border-radius:50%;background:var(--mute)}
.acts{margin-left:auto;display:flex;gap:2px;opacity:.001;transition:opacity var(--out) var(--soft-close)}
.bot:hover .acts,.bot:focus-within .acts,.bot.fresh .acts{opacity:1;transition-duration:var(--in)}

/* working line: status, time, and the travelling bar */
.working{display:flex;flex-direction:column;gap:8px;max-width:360px;cursor:pointer;border:0;background:none;padding:0;text-align:left}
.working .l{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--soft)}
.working .l b{font-weight:400;color:var(--text)}
.working .l .num{margin-left:auto;font-size:11px;color:var(--mute)}
.working .l .go{font:italic 400 12px var(--f-display);color:var(--gold)}
.glyph{width:17px;height:6px;flex:none}
.glyph polygon{fill:var(--gold);opacity:.2}
.on-g .glyph .f1{animation:fct 1.6s var(--release) infinite}.on-g .glyph .f2{animation:fct 1.6s var(--release) .26s infinite}.on-g .glyph .f3{animation:fct 1.6s var(--release) .53s infinite}.on-g .glyph .f4{animation:fct 1.6s var(--release) .8s infinite}.on-g .glyph .f5{animation:fct 1.6s var(--release) 1.06s infinite}.on-g .glyph .f6{animation:fct 1.6s var(--release) 1.33s infinite}
@keyframes fct{0%,100%{opacity:.18}35%{opacity:1}}

/* the travelling bar, kept exactly as liked */
.track{height:var(--rule-medium);background:var(--line-2);position:relative}
.track i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,transparent,var(--head));transition:width 1.1s var(--soft-close)}
.track i::after{content:"";position:absolute;right:-2px;top:-2px;width:5px;height:5px;border-radius:50%;background:var(--head);box-shadow:0 0 10px 2px var(--head-glow);opacity:0;transition:opacity .6s var(--soft-close)}
.think .track i{width:24%;animation:travel 2s var(--release) infinite}
.think .track i::after,.stream .track i::after{opacity:1}
@keyframes travel{from{left:-24%}to{left:100%}}
.done .track i{width:100%!important;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--gold) 55%,transparent))}

/* ---------- The Dispatch: the log, set like a magazine ---------- */
.dsp{position:fixed;top:0;right:0;bottom:0;z-index:40;width:min(440px,100vw);background:var(--sheet);border-left:var(--rule-hair) solid var(--line-2);box-shadow:-30px 0 80px -50px rgba(0,0,0,.5);display:flex;flex-direction:column;
  transform:translateX(24px);opacity:0;filter:blur(6px);pointer-events:none;transition:transform .9s var(--soft-close),opacity .6s var(--soft-close),filter .9s var(--soft-close)}
.dsp.open{transform:none;opacity:1;filter:none;pointer-events:auto}
.dsp-h{display:flex;align-items:center;gap:10px;padding:14px 16px 12px 22px;border-bottom:var(--rule-hair) solid var(--line-2)}
.dsp-h .cap:first-child{color:var(--ink)}
.dsp-h .ib{margin-left:auto}
.dsp-b{flex:1;overflow:auto;padding:22px 22px 30px}
.kicker{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.kicker .cap{color:var(--gold)}
.dsp h2{font:400 22px/1.3 var(--f-display);color:var(--ink);margin:0 0 8px;text-wrap:balance}
.dl{font:italic 400 12.5px var(--f-display);color:var(--soft);margin:0 0 16px}
.standfirst{font:italic 400 14.5px/1.6 var(--f-display);color:var(--text);margin:0 0 20px;padding-bottom:18px;border-bottom:var(--rule-hair) solid var(--line-2)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:0 0 24px;border-bottom:var(--rule-hair) solid var(--line-2)}
.stat{padding:0 0 14px}.stat+.stat{padding-left:14px;border-left:var(--rule-hair) solid var(--line-2)}
.stat .v{font:400 22px/1.2 var(--f-display);color:var(--ink);display:block;margin-bottom:2px;font-variant-numeric:tabular-nums}
.spark{display:block;width:100%;height:14px;margin-top:6px}
.dsp h3{margin:0 0 12px;display:flex;align-items:center;gap:10px}
.dsp h3::after{content:"";flex:1;height:var(--rule-hair);background:var(--line-2)}
.desk{display:grid;grid-template-columns:28px 1fr;gap:0 10px;padding:0 0 18px;margin-bottom:18px;border-bottom:var(--rule-hair) solid var(--line)}
.desk:last-child{border-bottom:0;margin-bottom:6px}
.desk .rn{font:400 15px/1.3 var(--f-display);color:var(--gold)}
.desk .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.desk .hd b{font-weight:400;font-size:10.5px;letter-spacing:var(--tracked);text-transform:uppercase;color:var(--ink)}
.desk .eff{display:inline-flex;align-items:center;gap:6px;font:italic 400 12px var(--f-display);color:var(--soft)}
.meter{display:inline-flex;gap:2px}.meter i{width:4px;height:8px;background:var(--line-3);clip-path:polygon(30% 0,100% 0,70% 100%,0 100%)}.meter i.on{background:var(--gold)}
.desk .st{margin-left:auto;font-size:10px;letter-spacing:var(--tracked-tight);text-transform:uppercase;color:var(--mute)}
.desk .st.pass{color:var(--ok)}.desk .st.fail{color:var(--bad)}.desk .st.live{color:var(--gold)}.desk .st.esc{color:var(--warn)}
.desk .task{grid-column:2;font:italic 400 14px/1.5 var(--f-display);color:var(--text);margin:4px 0 10px}
.desk .track{grid-column:2}
.desk .mt{grid-column:2;display:flex;gap:12px;align-items:center;margin-top:8px;font-size:11px;color:var(--mute)}
.desk .mt .rd{margin-left:auto;border:0;background:none;padding:0;cursor:pointer;font:italic 400 12px var(--f-display);color:var(--gold)}
.notes{grid-column:2;margin:10px 0 0;padding:0 0 0 12px;border-left:var(--rule-hair) solid var(--gold);font-size:12.5px;line-height:1.65;color:var(--soft);white-space:pre-wrap;word-break:break-word;max-height:0;overflow:hidden;opacity:0;transition:max-height .9s var(--soft-close),opacity .6s var(--soft-close)}
.desk.show .notes{max-height:260px;overflow:auto;opacity:1}
.chron{list-style:none;margin:0 0 22px;padding:0}
.chron li{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:6px 0;font-size:12.5px;color:var(--text)}
.chron .ts{font-size:10.5px;color:var(--mute);text-align:right;padding-top:2px;border-right:var(--rule-hair) solid var(--line-2);padding-right:12px}
.chron .ph{font-size:9.5px;letter-spacing:var(--tracked-tight);text-transform:uppercase;color:var(--gold);margin-right:8px}
.pull{margin:4px 0 22px;padding:14px 0;border-top:var(--rule-medium) solid var(--ink);border-bottom:var(--rule-hair) solid var(--line-2);font:italic 400 17px/1.5 var(--f-display);color:var(--ink);text-wrap:balance}
.colophon{font-size:10.5px;color:var(--mute);line-height:1.6;border-top:var(--rule-hair) solid var(--line-2);padding-top:12px}
.empty{font:italic 400 14px var(--f-display);color:var(--soft)}

/* ---------- palette, toasts, tips, jump ---------- */
.veil{position:fixed;inset:0;z-index:70;background:rgba(9,12,20,.28);opacity:0;pointer-events:none;transition:opacity .6s var(--soft-close)}
.veil.open{opacity:1;pointer-events:auto}
.pal{position:fixed;left:50%;top:16vh;z-index:71;width:min(540px,calc(100vw - 32px));background:var(--panel);border:var(--rule-hair) solid var(--line-3);border-radius:8px;box-shadow:var(--shadow);transform:translate(-50%,-6px) scale(.985);opacity:0;filter:blur(5px);pointer-events:none;transition:transform .9s var(--soft-close),opacity .5s var(--soft-close),filter .9s var(--soft-close)}
.pal.open{transform:translate(-50%,0);opacity:1;filter:none;pointer-events:auto}

.toasts{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--panel);border:var(--rule-hair) solid var(--line-3);border-radius:5px;box-shadow:var(--shadow);font-size:12.5px;color:var(--text);padding:7px 12px;animation:toast 3.2s var(--soft-close) both}
.toast em{font-family:var(--f-display);color:var(--gold)}
@keyframes toast{0%{opacity:0;filter:blur(4px);transform:translateY(6px)}12%{opacity:1;filter:none;transform:none}84%{opacity:1}100%{opacity:0;filter:blur(3px)}}
[data-tip]{position:relative}
[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font:400 11px var(--f-body);text-transform:none;letter-spacing:0;padding:4px 8px;border-radius:4px;white-space:nowrap;pointer-events:none;z-index:90;animation:tip .5s var(--soft-close) both}
@keyframes tip{from{opacity:0;filter:blur(3px);transform:translate(-50%,3px)}to{opacity:1;filter:none;transform:translate(-50%,0)}}
.jump{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translate(-50%,6px);opacity:0;pointer-events:none;border:var(--rule-hair) solid var(--line-3);background:var(--panel);border-radius:5px;box-shadow:var(--shadow);font-size:11.5px;color:var(--soft);padding:5px 10px;cursor:pointer;transition:opacity .6s var(--soft-close),transform .9s var(--soft-close)}
.jump.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.dock{position:relative}

@media (max-width:760px){.side{position:fixed;inset:0 auto 0 0;z-index:60;box-shadow:var(--shadow)}.app.folded .side{margin-left:0;transform:translateX(-102%)}.dsp{width:100vw}.scroll,.dock{padding-inline:16px}.hide-sm{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.think .track i{width:24%}}
</style>

<script>
(() => {
const $=s=>document.querySelector(s),app=$("#app"),root=document.documentElement;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const pad=(n,w=2)=>String(n).padStart(w,"0");
const ROMAN=["I","II","III","IV","V","VI"];

/* grain on the mark only: 6 tiles stepped at 24 fps */
(()=>{const c=document.createElement("canvas");c.width=c.height=150;const x=c.getContext("2d"),T=[];
 for(let k=0;k<6;k++){const d=x.createImageData(150,150);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=60}x.putImageData(d,0,0);T.push(`url(${c.toDataURL()})`)}
 root.style.setProperty("--grain",T[0]);
 const m=document.querySelector("#stage .mark");if(m){const s=new XMLSerializer().serializeToString(m);root.style.setProperty("--gmask",`url("data:image/svg+xml;charset=utf-8,${encodeURIComponent(s)}")`)}
 if(!reduce){let f=0,last=0;const step=t=>{if(t-last>=41.67&&!document.hidden&&!app.classList.contains("has-chat")){last=t;f=(f+1)%6;root.style.setProperty("--grain",T[f])}requestAnimationFrame(step)};requestAnimationFrame(step)}})();

/* status text decodes in from quiet noise */
const NOISE="abcdefghijklmnopqrstuvwxyz·";
function decode(el,to,dur=520){to=String(to);if(!el)return;if(reduce){el.textContent=to;return}
 const id=(el._d=(el._d||0)+1),t0=performance.now(),sd=[...to].map(()=>Math.random()*.3);
 const f=t=>{if(el._d!==id)return;const p=Math.min(1,(t-t0)/dur);let o="";for(let i=0;i<to.length;i++){const c=to[i];o+=(c===" "||p>=(i/to.length)*.7+sd[i])?c:NOISE[(Math.random()*NOISE.length)|0]}el.textContent=o;if(p<1)requestAnimationFrame(f);else el.textContent=to};requestAnimationFrame(f)}
function toast(h){const e=document.createElement("div");e.className="toast";e.innerHTML=h;$("#toasts").append(e);setTimeout(()=>e.remove(),3300)}

/* policy: orchestrator/POLICY.md (low=quick, medium=default, high=complex) */
const TIERS={low:{n:1,m:"quick",w:"light"},medium:{n:2,m:"default",w:"considered"},high:{n:3,m:"complex",w:"deep"}};
const ROSTER={
 research:{tiers:["medium","high"],floor:"medium",desk:"Research desk",verb:"Researching",brief:"Research specialist. Find facts, figures and precedents. Name each source or mark it unverified. Never present an unverified figure as fact."},
 finance:{tiers:["high"],floor:"high",desk:"Finance desk",verb:"Costing",brief:"Finance specialist. Build costs and pricing line by line from the facts given; state every assumption; totals in PHP unless told otherwise."},
 legal:{tiers:["high"],floor:"high",desk:"Legal desk",verb:"Reading clauses",brief:"Legal review specialist (Philippine context unless told otherwise). Flag each risk with the clause, exposure and a fix. No final legal opinion; say where counsel is needed."},
 decision:{tiers:["medium","high"],floor:"medium",desk:"Decision desk",verb:"Weighing options",brief:"Decision specialist. Options memo: recommendation, two or three options, trade-offs, risks, what the principal must decide. Recommend; never approve."},
 builder:{tiers:["medium"],floor:"medium",desk:"Drafting desk",verb:"Drafting",brief:"Builder. Produce the concrete artefact asked for (outline, plan, draft, table, code) in clean usable form."}};
const meter=t=>`<span class="meter" aria-hidden="true">${[1,2,3].map(i=>`<i class="${i<=TIERS[t].n?"on":""}"></i>`).join("")}</span>`;
const GLYPH=`<svg class="glyph" viewBox="0 0 1413 425" aria-hidden="true"><polygon class="f1" points="0,0 233,0 391,100 206,425 40,425 0,302"/><polygon class="f2" points="233,0 728,0 391,100"/><polygon class="f3" points="391,100 1058,425 206,425"/><polygon class="f4" points="391,100 728,0 778,0 871,225 1166,425 1058,425"/><polygon class="f5" points="918,0 1043,0 1408,425 1241,425 968,192"/><polygon class="f6" points="1043,0 1340,0 1408,425"/></svg>`;
const MARK=document.querySelector(".brand .mark").outerHTML;
const tok=s=>Math.round((s||"").length/4),ft=n=>n>=1000?(n/1000).toFixed(1)+"k":String(n);
const fmt=ms=>{const s=Math.floor(ms/1000);return s<60?s+" s":Math.floor(s/60)+" min "+pad(s%60)+" s"};
const mmss=ms=>{const s=Math.floor(ms/1000);return pad(Math.floor(s/60))+":"+pad(s%60)};
const stamp=ms=>{const t=ms/1000;return pad(Math.floor(t/60))+":"+pad(Math.floor(t%60))+"."+Math.floor((t*10)%10)};
const hhmm=ts=>{const d=new Date(ts);return pad(d.getHours())+":"+pad(d.getMinutes())};
const longDate=ts=>new Date(ts).toLocaleString("en-PH",{weekday:"long",day:"numeric",month:"long",year:"numeric",hour:"2-digit",minute:"2-digit"});
const words=n=>["No","One","Two","Three","Four","Five"][n]||String(n);

/* markdown */
function md(src){const L=src.split("\n");let o="",list=null,i=0;const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>");const close=()=>{if(list){o+=`</${list}>`;list=null}};

function streamInto(el,text,st){const tmp=document.createElement("div");tmp.innerHTML=md(text);const now=performance.now(),total=tmp.textContent.length;
 if(!st.h.length||total>st.h[st.h.length-1][0])st.h.push([total,now]);
 let cut=0;for(const [len,t] of st.h){if(t<=now-550)cut=len;else break}
 const arr=off=>{for(const [len,t] of st.h)if(len>off)return t;return now};
 if(!reduce){const tw=document.createTreeWalker(tmp,NodeFilter.SHOW_TEXT);const nodes=[];let n;while(n=tw.nextNode())nodes.push(n);let off=0;
  for(const node of nodes){const s=node.nodeValue,a=off,b=off+s.length;off=b;if(b<=cut)continue;const frag=document.createDocumentFragment();const k=Math.max(0,cut-a);if(k)frag.append(s.slice(0,k));let p=a+k;
   for(const part of s.slice(k).split(/(\s+)/)){if(!part)continue;if(/^\s+$/.test(part)){frag.append(part)}else{const sp=document.createElement("span");sp.className="w";sp.style.animationDelay=(-(now-arr(p)))+"ms";sp.textContent=part;frag.append(sp)}p+=part.length}
   node.replaceWith(frag)}}
